<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Abstract diagram of a two-brand social post generator: a grid of template thumbnails switching between two color modes">
  <rect width="1600" height="1000" fill="#111111"/>

  <!-- switch pill -->
  <rect x="120" y="110" width="220" height="56" rx="28" fill="none" stroke="#FFEE00" stroke-width="2"/>
  <circle cx="176" cy="138" r="18" fill="#FFEE00"/>
  <text x="220" y="145" font-family="monospace" font-size="20" fill="#FAFAFA">BRAND A</text>

  <rect x="1260" y="110" width="220" height="56" rx="28" fill="none" stroke="#888888" stroke-width="2"/>
  <circle cx="1436" cy="138" r="18" fill="none" stroke="#b0b0b0" stroke-width="2"/>
  <text x="1300" y="145" font-family="monospace" font-size="20" fill="#888888">BRAND B</text>

  <!-- template grid -->
  <g stroke="#222222" stroke-width="2">
    <rect x="120" y="230" width="360" height="450" rx="10" fill="#1a1a1a"/>
    <rect x="510" y="230" width="360" height="210" rx="10" fill="#1a1a1a"/>
    <rect x="510" y="470" width="360" height="210" rx="10" fill="#1a1a1a"/>
    <rect x="900" y="230" width="580" height="140" rx="10" fill="#1a1a1a"/>
    <rect x="900" y="400" width="280" height="280" rx="10" fill="#1a1a1a"/>
    <rect x="1200" y="400" width="280" height="280" rx="10" fill="#1a1a1a"/>
  </g>

  <!-- accent marks: title/caption lines inside first card -->
  <rect x="150" y="560" width="220" height="18" rx="4" fill="#FFEE00"/>
  <rect x="150" y="595" width="300" height="12" rx="4" fill="#333333"/>
  <rect x="150" y="620" width="260" height="12" rx="4" fill="#333333"/>
  <circle cx="300" cy="330" r="70" fill="none" stroke="#FFEE00" stroke-width="3"/>

  <!-- second row accents -->
  <rect x="540" y="260" width="180" height="14" rx="4" fill="#FFEE00"/>
  <rect x="540" y="500" width="150" height="14" rx="4" fill="#555555"/>

  <!-- bottom row: export tray -->
  <g stroke="#FFEE00" stroke-width="2" fill="none">
    <rect x="120" y="740" width="1360" height="120" rx="12"/>
  </g>
  <rect x="150" y="775" width="26" height="50" rx="4" fill="#FFEE00"/>
  <rect x="190" y="775" width="26" height="50" rx="4" fill="#555555"/>
  <rect x="230" y="775" width="26" height="50" rx="4" fill="#FFEE00"/>
  <text x="290" y="808" font-family="monospace" font-size="18" fill="#b0b0b0">export · 1080px · 0€</text>
</svg>
