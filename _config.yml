title: Alejandro Amaro | Product & Visual Designer
description: Product & Visual Designer in Strasbourg, France. I design interfaces, visual identities, and internal tools.
baseurl: ""
url: "https://www.alejandro-is.me"
lang: fr

# Data still to provide. While a value is empty, the element that needs it
# is not rendered at all (no marker on screen). The header button reads
# "Me contacter" until cal_url is set, then "Échanger 20 min".
cal_url: ""        # Not used for now (decision of Ale, 13/11/2026): no booking link.
instagram_url: "https://www.instagram.com/alejandroid_a.m/"
malt_url: "https://www.malt.fr/profile/alejandroamaromendoza"  # Contact page + JSON-LD sameAs. Empty = hidden.
siret: "108 337 783 00014"  # SIREN 108 337 783
address: "67 rue de Saint-Dié, 67100 Strasbourg"  # TEMPORARY: current home address, shown ONLY on the legal notice (mentions-legales.html). Replace when the business address changes (domiciliation). Never use it elsewhere (no footer, no JSON-LD, no meta).
# CV downloads on À propos / About. Empty = no button. Put the PDFs in
# assets/docs/ and write the path, e.g. "/assets/docs/cv-alejandro-amaro-fr.pdf".
# Contact form. false = the form is not rendered anywhere: Contact shows only the
# email (copy button + mailto), and the Formspree sentence of the legal notice is
# hidden. true = the form works as before. Before switching to true, check that
# the Formspree endpoint in _includes/contact.html is really yours (see NOTAS).
form_enabled: false
cv_pdf_fr: "/assets/docs/CV-Alejandro-FR.pdf"
cv_pdf_en: "/assets/docs/CV-Alejandro-EN.pdf"

author:
  name: Alejandro Amaro Mendoza
  email: ale.amaro.m@proton.me
  url: "https://www.alejandro-is.me"
  linkedin: "https://www.linkedin.com/in/alejandro-a-mendoza/"

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-default.png
  - scope:
      path: "tools"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en

exclude:
  - _pendientes   # unpublished projects (see _data/proximamente.yml)
  - bedizen_v2
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTAS-PARA-ALE.md
  - .gitignore
  - tools/optimize-images.sh

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed