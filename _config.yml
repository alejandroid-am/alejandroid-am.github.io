title: Alejandro Amaro | Product & Visual Designer
description: Product & Visual Designer in Strasbourg, France. I design interfaces, visual identities, and internal tools.
baseurl: ""
url: "https://www.alejandro-is.me"
lang: fr

# Contact links still to provide. While empty, the page shows the
# [[A COMPLETAR]] marker instead of a link, and the header button reads
# "Me contacter" (it switches to "Échanger 20 min" once cal_url is set).
cal_url: ""        # [[A COMPLETAR: enlace Cal.com]]
malt_url: ""       # [[A COMPLETAR: URL Malt]]
instagram_url: ""  # [[A COMPLETAR: URL Instagram]]
next_slot: ""      # [[A COMPLETAR: fecha]] próximo hueco libre, p. ej. "janvier 2027"

author:
  name: Alejandro Amaro Mendoza
  email: ale.amaro.m@proton.me
  url: "https://www.alejandro-is.me"
  linkedin: "https://www.linkedin.com/in/alejandro-a-mendoza/"

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-default.webp
  - scope:
      path: "tools"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en

exclude:
  - bedizen_v2
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed