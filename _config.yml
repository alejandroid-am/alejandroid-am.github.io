title: Alejandro Amaro | Product & Visual Designer
description: Product & Visual Designer in Strasbourg, France. I design interfaces, visual identities, and internal tools.
baseurl: ""
url: "https://www.alejandro-is.me"
lang: fr

# Data still to provide. While a value is empty, the element that needs it
# is not rendered at all (no marker on screen). The header button reads
# "Me contacter" until cal_url is set, then "Échanger 20 min".
cal_url: ""        # [[A COMPLETAR: enlace Cal.com]]
instagram_url: ""  # [[A COMPLETAR: URL Instagram]]
siret: ""          # [[A COMPLETAR: SIRET]] (mentions légales)
address: ""        # [[A COMPLETAR: adresse professionnelle]] (mentions légales)

author:
  name: Alejandro Amaro Mendoza
  email: ale.amaro.m@proton.me
  url: "https://www.alejandro-is.me"
  linkedin: "https://www.linkedin.com/in/alejandro-a-mendoza/"

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-default.webp
  - scope:
      path: "tools"
    values:
      sitemap: false
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en

exclude:
  - bedizen_v2
  - node_modules
  - Gemfile
  - Gemfile.lock
  - README.md
  - .gitignore

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

sass:
  style: compressed