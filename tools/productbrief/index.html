  :root{
    --bg:#111111;
    --bg-raised:#1a1a1a;
    --bg-input:#111111;
    --border:#222222;
    --border-soft:#222222;
    --text:#FAFAFA;
    --text-dim:#b0b0b0;
    --text-faint:#888888;
    --accent:#FFEE00;
    --accent-dim:#8A8000;
    --radius:6px;
    --display:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --sans:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}

  /* progress bar */
  .progress-wrap{
    position:fixed;top:0;left:0;right:0;
    height:3px;background:var(--border-soft);z-index:10;
  }
  .progress-bar{height:100%;background:var(--accent);width:0;transition:width .3s ease;}

  /* top meta strip */
  .topstrip{
    position:fixed;top:3px;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;background:var(--bg);z-index:9;
    border-bottom:1px solid var(--border-soft);
  }
  .topstrip .brand{display:flex;align-items:baseline;gap:8px;}
  .topstrip .brand .x{color:var(--accent);font-size:18px;font-weight:900;}
  .topstrip .brand .name{font-weight:800;font-size:14px;letter-spacing:0.02em;}
  .topstrip .step-count{font-family:var(--mono);font-size:12px;color:var(--text-faint);}

  /* stage */
  .stage{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:120px 24px 140px;
  }
  .card{width:100%;max-width:640px;}

  .q-eyebrow{
    font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--accent-dim);margin-bottom:14px;
  }
  .q-title{
    font-family:var(--display);
    font-weight:700;font-size:30px;letter-spacing:-0.01em;
    margin:0 0 10px;line-height:1.2;
  }
  .q-help{color:var(--text-dim);font-size:15px;margin:0 0 28px;max-width:56ch;}

  textarea,.text-input{
    width:100%;background:var(--bg-input);
    border:1px solid var(--border);border-radius:var(--radius);
    color:var(--text);font-family:inherit;font-size:16px;
    padding:13px 15px;resize:vertical;
  }
  textarea{min-height:120px;}
  textarea::placeholder,.text-input::placeholder{color:var(--text-faint);}
  textarea:focus,.text-input:focus{outline:none;border-color:var(--accent-dim);}

  /* choice options */
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    display:flex;align-items:center;gap:12px;
    border:1px solid var(--border);background:var(--bg-input);
    border-radius:var(--radius);padding:16px 18px;
    color:var(--text);font-size:16px;text-align:left;cursor:pointer;
    transition:border-color .12s ease;
  }
  .choice:hover{border-color:#38383e;}
  .choice .tick{
    width:20px;height:20px;border:1.5px solid var(--border);border-radius:4px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:var(--bg);
  }
  .choice[aria-pressed="true"]{border-color:var(--accent);background:rgba(255,238,0,0.06);}
  .choice[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);}
  .choice[aria-pressed="true"] .tick::after{content:"✓";font-weight:700;}
  .choice.radio .tick{border-radius:50%;}

  .multi-hint{font-size:12px;color:var(--text-faint);margin-top:12px;}

  /* dynamic feature list */
  .feat-row{
    display:grid;grid-template-columns:1fr auto auto;gap:10px;
    margin-bottom:10px;align-items:center;
  }
  .feat-row select{
    background:var(--bg-input);border:1px solid var(--border);
    border-radius:var(--radius);color:var(--text);font-family:inherit;
    font-size:14px;padding:10px 12px;cursor:pointer;
  }
  .feat-row .rm{
    background:transparent;border:1px solid var(--border);color:#C97B7B;
    border-radius:var(--radius);padding:9px 12px;font-size:13px;cursor:pointer;
  }
  @media (max-width:560px){.feat-row{grid-template-columns:1fr;}}

  /* spectrum */
  .spectrum-row{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:center;gap:14px;margin-bottom:22px;
  }
  .spectrum-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;color:var(--text-dim);}
  .spectrum-label.right{text-align:right;}
  .spectrum-track-wrap{position:relative;height:34px;display:flex;align-items:center;min-width:180px;}
  .spectrum-line{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border);transform:translateY(-50%);}
  .spectrum-marker{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(45deg);pointer-events:none;}
  .spectrum-marker::before,.spectrum-marker::after{content:"";position:absolute;background:var(--accent);}
  .spectrum-marker::before{left:0;right:0;top:50%;height:3px;transform:translateY(-50%);}
  .spectrum-marker::after{top:0;bottom:0;left:50%;width:3px;transform:translateX(-50%);}
  .spectrum-track-wrap input[type=range]{position:absolute;left:0;right:0;width:100%;height:34px;margin:0;opacity:0;cursor:pointer;}

  /* nav bar */
  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 28px;background:var(--bg);
    border-top:1px solid var(--border-soft);z-index:9;
  }
  .navbar .left-actions{display:flex;gap:10px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:var(--radius);
    border:1px solid var(--border);background:var(--bg-raised);color:var(--text);
    font-size:14px;font-weight:600;cursor:pointer;transition:border-color .12s ease;
  }
  .btn:hover{border-color:#38383e;}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#1A1300;}
  .btn-primary:hover{background:#fff34d;border-color:#fff34d;}
  .btn-ghost{background:transparent;color:var(--text-dim);}
  .btn:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.choice:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px;
  }

  /* language pills (first screen) */
  .lang-pills{display:flex;gap:10px;}
  .lang-pill{
    flex:1;border:1px solid var(--border);background:var(--bg-input);
    border-radius:var(--radius);padding:18px;font-size:16px;font-weight:700;
    color:var(--text-dim);cursor:pointer;letter-spacing:0.04em;
  }
  .lang-pill[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:rgba(255,238,0,0.06);}

  /* review / summary screen */
  .review h2{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 6px;}
  .review .review-sub{color:var(--text-dim);font-size:14px;margin:0 0 26px;}
  .review-item{
    border:1px solid var(--border-soft);border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
  }
  .review-item .ri-q{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:5px;}
  .review-item .ri-a{font-size:15px;white-space:pre-wrap;}
  .review-item .ri-a.empty{color:var(--text-faint);font-style:italic;}
  .review-item .ri-edit{
    float:right;background:transparent;border:none;color:var(--accent-dim);
    font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:0.04em;
  }

  #print-view{display:none;}

  @media print{
    body{background:#fff;color:#111;}
    .progress-wrap,.topstrip,.stage,.navbar{display:none !important;}
    #print-view{display:block;color:#111;padding:0;}
    #print-view .pv-page{padding:0 6mm;}
    #print-view .pv-header{display:flex;align-items:center;gap:3mm;margin-bottom:2mm;}
    #print-view .pv-header .pv-mark{
      width:5mm;height:5mm;border:2px solid #111;display:flex;align-items:center;
      justify-content:center;font-weight:800;font-size:9px;flex-shrink:0;transform:rotate(45deg);
    }
    #print-view .pv-header .pv-eyebrow{font-size:10px;font-weight:700;letter-spacing:0.14em;color:#8A8000;text-transform:uppercase;}
    #print-view h1{font-family:var(--display);font-weight:800;font-size:27px;margin:0 0 3mm;letter-spacing:-0.01em;}
    #print-view .pv-meta{font-size:11px;color:#555;margin-bottom:6mm;padding-bottom:4mm;border-bottom:2.5px solid #111;}
    #print-view h2{
      font-family:var(--display);font-weight:700;font-size:15.5px;
      display:flex;align-items:baseline;gap:2.5mm;
      margin:9mm 0 4mm;padding-bottom:2mm;border-bottom:2px solid #111;page-break-after:avoid;
    }
    #print-view h2 .pv-num{font-family:var(--mono),monospace;font-weight:700;font-size:10.5px;color:#8A8000;}
    #print-view .pv-field{margin-bottom:3.5mm;break-inside:avoid;}
    #print-view .pv-field .pv-q{font-size:9.5px;font-weight:700;color:#8A8000;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:1.3mm;}
    #print-view .pv-field .pv-a{font-size:11.5px;white-space:pre-wrap;color:#111;border:1px solid #ddd;border-radius:2px;padding:2.6mm 3mm;}
    #print-view .pv-field .pv-a.empty{color:#999;font-style:italic;border-style:dashed;}
    #print-view .pv-feat-list{list-style:none;padding:0;margin:0 0 4mm;}
    #print-view .pv-feat-list li{margin-bottom:2mm;font-size:11.5px;border:1px solid #ddd;border-radius:2px;padding:2.2mm 3mm;}
    #print-view .pv-feat-list .pv-prio{font-weight:700;color:#8A8000;font-size:9px;text-transform:uppercase;letter-spacing:0.04em;}
    #print-view .pv-spectrum-row{
      display:grid;grid-template-columns:32mm 1fr 32mm;align-items:center;gap:4mm;
      font-size:9.5px;font-weight:600;padding:2.6mm 0;break-inside:avoid;
    }
    #print-view .pv-spectrum-row:not(:last-child){border-bottom:0.75px solid #eee;}
    #print-view .pv-spectrum-line{position:relative;height:5mm;border-bottom:1.25px solid #999;}
    #print-view .pv-spectrum-mark{position:absolute;top:50%;width:5mm;height:5mm;transform:translate(-50%,-50%);overflow:visible;}
    #print-view .pv-spectrum-mark line{stroke:#111;stroke-width:2.6;stroke-linecap:round;}
    @page{margin:14mm;}
  }
</style>
</head>

  var SPECTRUM_DEFS = {
    min_rich:        tri(["Minimalista","Rico en funciones"],["Minimal","Feature-rich"],["Minimaliste","Riche en fonctions"]),
    guided_flexible: tri(["Guiado","Flexible"],["Guided","Flexible"],["Guidé","Flexible"]),
    simple_powerful: tri(["Simple","Potente"],["Simple","Powerful"],["Simple","Puissant"]),
    mvp_complete:    tri(["MVP rápido","Completo día uno"],["Fast MVP","Complete day one"],["MVP rapide","Complet dès le début"]),
    b2c_b2b:         tri(["B2C","B2B"],["B2C","B2B"],["B2C","B2B"])
  };

  /* ---------- STATE ---------- */
  function defaultState(){
    var sp={}; SPECTRUM_IDS.forEach(function(id){sp[id]=50;});
    return {lang:null, idx:0, answers:{ features:[], spectrum:sp } , reviewing:false};
  }

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var p = JSON.parse(raw);
      var d = defaultState();
      d.lang = p.lang || null;
      d.idx = p.idx || 0;
      d.reviewing = !!p.reviewing;
      if(p.answers){
        d.answers = p.answers;
        if(!d.answers.features) d.answers.features = [];
        if(!d.answers.spectrum){ var sp={}; SPECTRUM_IDS.forEach(function(id){sp[id]=50;}); d.answers.spectrum=sp; }
        else SPECTRUM_IDS.forEach(function(id){ if(typeof d.answers.spectrum[id]!=="number") d.answers.spectrum[id]=50; });
      }
      return d;
    }catch(e){ return defaultState(); }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function T(key){ var d=UI[state.lang]||UI.es; return d[key]!=null?d[key]:UI.es[key]; }
  function lg(obj){ return obj[state.lang]||obj.es; }

  /* ---------- VISIBLE QUESTION LIST (branch-aware) ---------- */
  function visibleQuestions(){
    return QUESTIONS.filter(function(q){
      return !q.showIf || q.showIf(state.answers);
    });
  }

  /* When a branch answer changes, prune answers that are no longer visible */
  function pruneHiddenAnswers(){
    var visibleIds = {};
    visibleQuestions().forEach(function(q){ visibleIds[q.id]=true; });
    Object.keys(state.answers).forEach(function(k){
      if(k==="features"||k==="spectrum") return;
      if(!visibleIds[k]) delete state.answers[k];
    });
  }

  /* ---------- DOM refs ---------- */
  var card = document.getElementById("card");
  var progressBar = document.getElementById("progress-bar");
  var stepCount = document.getElementById("step-count");
  var btnBack = document.getElementById("btn-back");
  var btnNext = document.getElementById("btn-next");

  /* ---------- RENDER ---------- */
  function render(){
    document.getElementById("html-root").setAttribute("lang", state.lang||"es");

    if(state.lang===null){ renderLanguage(); return; }
    if(state.reviewing){ renderReview(); return; }

    var qs = visibleQuestions();
    if(state.idx>=qs.length){ state.reviewing=true; save(); renderReview(); return; }

    var q = qs[state.idx];
    var total = qs.length;

    progressBar.style.width = ((state.idx)/total*100) + "%";
    stepCount.textContent = T("step")+" "+(state.idx+1)+" "+T("of")+" "+total;
    document.querySelector(".topstrip .name").textContent = "Product Brief";

    btnBack.style.visibility = state.idx===0 ? "hidden" : "visible";
    btnBack.textContent = T("back");
    btnNext.textContent = (state.idx===total-1) ? T("finish") : T("next");

    var sec = SECTIONS[q.section];
    var html = '<div class="q-eyebrow">'+esc(lg(sec))+'</div>';
    html += '<h1 class="q-title">'+esc(lg(q.q))+'</h1>';
    if(q.help) html += '<p class="q-help">'+esc(lg(q.help))+'</p>';
    card.innerHTML = html;

    if(q.type==="text") renderText(q);
    else if(q.type==="date") renderDate(q);
    else if(q.type==="single") renderChoices(q,false);
    else if(q.type==="multi") renderChoices(q,true);
    else if(q.type==="features") renderFeatures(q);
    else if(q.type==="spectrum") renderSpectrum(q);
  }

  function renderLanguage(){
    progressBar.style.width="0%";
    stepCount.textContent="";
    btnBack.style.visibility="hidden";
    btnNext.style.visibility="hidden";
    card.innerHTML =
      '<div class="q-eyebrow">Language · Langue · Idioma</div>'+
      '<h1 class="q-title">Product Brief</h1>'+
      '<p class="q-help">Selecciona el idioma · Select the language · Choisissez la langue</p>'+
      '<div class="lang-pills">'+
        '<button class="lang-pill" data-lang="es" aria-pressed="false">Español</button>'+
        '<button class="lang-pill" data-lang="en" aria-pressed="false">English</button>'+
        '<button class="lang-pill" data-lang="fr" aria-pressed="false">Français</button>'+
      '</div>';
    card.querySelectorAll(".lang-pill").forEach(function(b){
      b.addEventListener("click", function(){
        state.lang=b.dataset.lang; state.idx=0; save();
        btnNext.style.visibility="visible";
        render();
      });
    });
  }

  function renderText(q){
    var ta=document.createElement("textarea");
    ta.value=state.answers[q.id]||"";
    ta.setAttribute("aria-label", lg(q.q));
    ta.addEventListener("input", function(){ state.answers[q.id]=ta.value; save(); });
    card.appendChild(ta);
    setTimeout(function(){ta.focus();},50);
  }

  function renderDate(q){
    var inp=document.createElement("input");
    inp.type="date"; inp.className="text-input";
    inp.value=state.answers[q.id]||"";
    inp.setAttribute("aria-label", lg(q.q));
    inp.addEventListener("input", function(){ state.answers[q.id]=inp.value; save(); });
    card.appendChild(inp);
  }

  function renderChoices(q, multi){
    var wrap=document.createElement("div");
    wrap.className="choices";
    var current = state.answers[q.id];
    if(multi && !Array.isArray(current)){ current=[]; }

    q.options.forEach(function(opt){
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="choice"+(multi?"":" radio");
      var pressed = multi ? current.indexOf(opt.value)>-1 : current===opt.value;
      btn.setAttribute("aria-pressed", pressed?"true":"false");
      btn.innerHTML='<span class="tick"></span><span>'+esc(lg(opt.label))+'</span>';
      btn.addEventListener("click", function(){
        if(multi){
          var arr = Array.isArray(state.answers[q.id])?state.answers[q.id].slice():[];
          var i=arr.indexOf(opt.value);
          if(i>-1) arr.splice(i,1); else arr.push(opt.value);
          state.answers[q.id]=arr;
          save();
          renderChoices.refresh(wrap,q,true);
        } else {
          state.answers[q.id]=opt.value;
          pruneHiddenAnswers();
          save();
          renderChoices.refresh(wrap,q,false);
        }
      });
      wrap.appendChild(btn);
    });
    card.appendChild(wrap);
    if(multi){
      var hint=document.createElement("p");
      hint.className="multi-hint"; hint.textContent=T("multiHint");
      card.appendChild(hint);
    }
  }
  renderChoices.refresh=function(wrap,q,multi){
    var current=state.answers[q.id];
    if(multi && !Array.isArray(current)) current=[];
    var btns=wrap.querySelectorAll(".choice");
    q.options.forEach(function(opt,i){
      var pressed = multi ? current.indexOf(opt.value)>-1 : current===opt.value;
      btns[i].setAttribute("aria-pressed", pressed?"true":"false");
    });
  };

  function renderFeatures(q){
    var listWrap=document.createElement("div");
    card.appendChild(listWrap);

    var addBtn=document.createElement("button");
    addBtn.type="button"; addBtn.className="btn btn-ghost"; addBtn.style.marginTop="6px";
    addBtn.textContent=T("addFeature");
    card.appendChild(addBtn);

    function draw(){
      listWrap.innerHTML="";
      state.answers.features.forEach(function(f,i){
        var row=document.createElement("div"); row.className="feat-row";

        var name=document.createElement("input");
        name.type="text"; name.className="text-input";
        name.placeholder=T("featurePlaceholder");
        name.value=f.name||"";
        name.setAttribute("aria-label","Feature "+(i+1));
        name.addEventListener("input", function(){ state.answers.features[i].name=name.value; save(); });

        var sel=document.createElement("select");
        sel.setAttribute("aria-label","Priority "+(i+1));
        PRIORITY_IDS.forEach(function(pid){
          var o=document.createElement("option");
          o.value=pid; o.textContent=T("priorityLabels")[pid];
          if(f.priority===pid) o.selected=true;
          sel.appendChild(o);
        });
        if(!f.priority){ state.answers.features[i].priority="must"; }
        sel.addEventListener("change", function(){ state.answers.features[i].priority=sel.value; save(); });

        var rm=document.createElement("button");
        rm.type="button"; rm.className="rm"; rm.textContent=T("removeFeature");
        rm.addEventListener("click", function(){ state.answers.features.splice(i,1); save(); draw(); });

        row.appendChild(name); row.appendChild(sel); row.appendChild(rm);
        listWrap.appendChild(row);
      });
    }
    draw();

    addBtn.addEventListener("click", function(){
      state.answers.features.push({name:"",priority:"must"}); save(); draw();
      var rows=listWrap.querySelectorAll(".feat-row");
      var last=rows[rows.length-1]; if(last) last.querySelector("input").focus();
    });
  }

  function renderSpectrum(q){
    SPECTRUM_IDS.forEach(function(id){
      var pair=lg(SPECTRUM_DEFS[id]);
      var row=document.createElement("div"); row.className="spectrum-row";

      var l=document.createElement("div"); l.className="spectrum-label"; l.textContent=pair[0];
      var tw=document.createElement("div"); tw.className="spectrum-track-wrap";
      var line=document.createElement("div"); line.className="spectrum-line";
      var mark=document.createElement("div"); mark.className="spectrum-marker";
      var inp=document.createElement("input");
      inp.type="range"; inp.min="0"; inp.max="100"; inp.step="1";
      inp.value=state.answers.spectrum[id];
      inp.setAttribute("aria-label", pair[0]+" – "+pair[1]);
      function pos(){ mark.style.left=inp.value+"%"; }
      pos();
      inp.addEventListener("input", function(){ state.answers.spectrum[id]=Number(inp.value); pos(); save(); });
      tw.appendChild(line); tw.appendChild(mark); tw.appendChild(inp);

      var r=document.createElement("div"); r.className="spectrum-label right"; r.textContent=pair[1];
      row.appendChild(l); row.appendChild(tw); row.appendChild(r);
      card.appendChild(row);
    });
  }

  /* ---------- REVIEW ---------- */
  function renderReview(){
    progressBar.style.width="100%";
    stepCount.textContent="";
    btnBack.style.visibility="visible"; btnBack.textContent=T("back");
    btnNext.style.visibility="hidden";

    var html='<div class="review">';
    html+='<h2>'+esc(T("reviewTitle"))+'</h2>';
    html+='<p class="review-sub">'+esc(T("reviewSub"))+'</p>';

    var qs=visibleQuestions();
    qs.forEach(function(q,i){
      html+='<div class="review-item">';
      html+='<button class="ri-edit" data-goto="'+i+'">'+esc(T("edit"))+'</button>';
      html+='<div class="ri-q">'+esc(lg(q.q))+'</div>';
      html+='<div class="ri-a'+(answerIsEmpty(q)?' empty':'')+'">'+esc(answerText(q))+'</div>';
      html+='</div>';
    });
    html+='</div>';
    card.innerHTML=html;

    card.querySelectorAll(".ri-edit").forEach(function(b){
      b.addEventListener("click", function(){
        state.idx=Number(b.dataset.goto); state.reviewing=false; save(); render();
        window.scrollTo(0,0);
      });
    });

    // action bar
    var actions=document.createElement("div");
    actions.style.cssText="display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;";
    var pdf=mkBtn(T("exportPdf"),"btn-primary"); pdf.addEventListener("click", exportPdf);
    var mail=mkBtn(T("sendMail"),"btn-ghost"); mail.addEventListener("click", sendMail);
    var restart=mkBtn(T("restart"),"btn-ghost"); restart.addEventListener("click", function(){
      if(!confirm(T("confirmRestart"))) return;
      var lang=state.lang; state=defaultState(); state.lang=lang; save(); render();
    });
    actions.appendChild(pdf); actions.appendChild(mail); actions.appendChild(restart);
    card.querySelector(".review").appendChild(actions);
  }
  function mkBtn(label,cls){ var b=document.createElement("button"); b.className="btn "+cls; b.textContent=label; return b; }

  /* ---------- answer helpers ---------- */
  function answerIsEmpty(q){
    var a=state.answers[q.id];
    if(q.type==="features") return !state.answers.features.some(function(f){return (f.name||"").trim();});
    if(q.type==="spectrum") return false;
    if(q.type==="multi") return !Array.isArray(a)||a.length===0;
    return !a || !(""+a).trim();
  }
  function answerText(q){
    if(q.type==="features"){
      var fs=state.answers.features.filter(function(f){return (f.name||"").trim();});
      if(!fs.length) return T("noAnswer");
      return fs.map(function(f){ return "• "+f.name+" ["+T("priorityLabels")[f.priority||"must"]+"]"; }).join("\n");
    }
    if(q.type==="spectrum"){
      return SPECTRUM_IDS.map(function(id){
        var pair=lg(SPECTRUM_DEFS[id]);
        return pair[0]+" — "+state.answers.spectrum[id]+"/100 — "+pair[1];
      }).join("\n");
    }
    if(q.type==="multi"){
      var arr=state.answers[q.id];
      if(!Array.isArray(arr)||!arr.length) return T("noAnswer");
      return arr.map(function(v){
        var opt=q.options.filter(function(o){return o.value===v;})[0];
        return opt?lg(opt.label):v;
      }).join(", ");
    }
    if(q.type==="single"){
      var v=state.answers[q.id];
      if(!v) return T("noAnswer");
      var opt=q.options.filter(function(o){return o.value===v;})[0];
      return opt?lg(opt.label):v;
    }
    var a=state.answers[q.id];
    return (a && (""+a).trim()) ? a : T("noAnswer");
  }

  /* ---------- NAV ---------- */
  btnNext.addEventListener("click", function(){
    var qs=visibleQuestions();
    var q=qs[state.idx];
    if(q && q.required && answerIsEmpty(q)){
      flashRequired();
      return;
    }
    if(state.idx>=qs.length-1){ state.reviewing=true; save(); render(); window.scrollTo(0,0); return; }
    state.idx++; save(); render(); window.scrollTo(0,0);
  });
  btnBack.addEventListener("click", function(){
    if(state.reviewing){ state.reviewing=false; var qs=visibleQuestions(); state.idx=qs.length-1; save(); render(); window.scrollTo(0,0); return; }
    if(state.idx>0){ state.idx--; save(); render(); window.scrollTo(0,0); }
  });

  function flashRequired(){
    var existing=card.querySelector(".req-msg");
    if(existing) return;
    var msg=document.createElement("p");
    msg.className="req-msg";
    msg.style.cssText="color:#E5A0A0;font-size:13px;margin-top:14px;";
    msg.textContent=T("required");
    card.appendChild(msg);
    setTimeout(function(){ if(msg.parentNode) msg.parentNode.removeChild(msg); },2600);
  }

  /* ---------- EXPORT PDF ---------- */
  function esc(s){ var d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

  function buildPrintView(){
    var a=state.answers;
    var clientName=a.client||"";
    var title=(clientName?clientName+" — ":"")+"Product Brief";
    var html='<div class="pv-page">';
    html+='<div class="pv-header"><div class="pv-mark">X</div><div class="pv-eyebrow">'+esc(T("pvEyebrow"))+'</div></div>';
    html+='<h1>'+esc(title)+'</h1>';
    var metaLine=[a.product_name, a.date].filter(Boolean).map(esc).join(" · ");
    html+='<div class="pv-meta">'+metaLine+'</div>';

    var qs=visibleQuestions();
    // group by section, in order, skipping basics fields already in header
    var lastSection=null, num=0;
    var sectionOrder=["stage","platform","problem","scope","reqs","spectrum","success","closing"];
    // build a section->questions map preserving order
    sectionOrder.forEach(function(secKey){
      var secQs=qs.filter(function(q){return q.section===secKey;});
      if(!secQs.length) return;
      num++;
      var padded=(num<10?"0":"")+num;
      html+='<h2><span class="pv-num">'+padded+'</span>'+esc(lg(SECTIONS[secKey]))+'</h2>';
      secQs.forEach(function(q){
        if(q.type==="features"){
          html+='<div class="pv-field"><div class="pv-q">'+esc(lg(q.q))+'</div>';
          var fs=state.answers.features.filter(function(f){return (f.name||"").trim();});
          if(fs.length){
            html+='<ul class="pv-feat-list">';
            fs.forEach(function(f){
              html+='<li><span class="pv-prio">'+esc(T("priorityLabels")[f.priority||"must"])+'</span> — '+esc(f.name)+'</li>';
            });
            html+='</ul>';
          } else {
            html+='<div class="pv-a empty">'+esc(T("noAnswer"))+'</div>';
          }
          html+='</div>';
        } else if(q.type==="spectrum"){
          html+='<div class="pv-field"><div class="pv-q">'+esc(lg(q.q))+'</div></div>';
          SPECTRUM_IDS.forEach(function(id){
            var pair=lg(SPECTRUM_DEFS[id]);
            var val=state.answers.spectrum[id];
            html+='<div class="pv-spectrum-row">'+
              '<div style="text-align:right">'+esc(pair[0])+'</div>'+
              '<div class="pv-spectrum-line"><svg class="pv-spectrum-mark" style="left:'+val+'%" viewBox="0 0 20 20">'+
                '<line x1="4" y1="4" x2="16" y2="16"></line><line x1="16" y1="4" x2="4" y2="16"></line></svg></div>'+
              '<div>'+esc(pair[1])+'</div></div>';
          });
        } else {
          var empty=answerIsEmpty(q);
          html+='<div class="pv-field"><div class="pv-q">'+esc(lg(q.q))+'</div>'+
            '<div class="pv-a'+(empty?' empty':'')+'">'+esc(answerText(q))+'</div></div>';
        }
      });
    });

    html+='</div>';
    document.getElementById("print-view").innerHTML=html;
  }

  function exportPdf(){ buildPrintView(); window.print(); }

  /* ---------- MAILTO ---------- */
  function buildMailBody(){
    var a=state.answers;
    var lines=[];
    lines.push((a.client?a.client+" ":"")+"— Product Brief");
    var metaLine=[a.product_name,a.date].filter(Boolean).join(" · ");
    if(metaLine) lines.push(metaLine);
    lines.push("");

    var qs=visibleQuestions();
    var sectionOrder=["stage","platform","problem","scope","reqs","spectrum","success","closing"];
    sectionOrder.forEach(function(secKey){
      var secQs=qs.filter(function(q){return q.section===secKey;});
      if(!secQs.length) return;
      lines.push("## "+lg(SECTIONS[secKey]));
      secQs.forEach(function(q){
        lines.push(lg(q.q)+": "+answerText(q).replace(/\n/g,"; "));
      });
      lines.push("");
    });

    var full=lines.join("\n");
    if(full.length>MAILTO_SAFE_BODY_CHARS){
      var cut=full.slice(0,MAILTO_SAFE_BODY_CHARS);
      var lb=cut.lastIndexOf("\n"); if(lb>0) cut=cut.slice(0,lb);
      full=cut+"\n\n"+T("mailTruncated");
    }
    return full;
  }
  function sendMail(){
    var a=state.answers;
    var subject=(a.client?a.client+" ":"")+"Product Brief";
    var body=buildMailBody();
    window.location.href="mailto:"+MAILTO_ADDRESS+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  }

  /* ---------- INIT ---------- */
  render();

})();

</script>
