A","manuel"]},{id:"1.7",thematique:"Images",intitule:"Pour chaque image porteuse d\u2019information ayant une description d\xE9taill\xE9e, cette description est-elle pertinente ?",intituleCourt:"Pertinence de la description d\xE9taill\xE9e",niveauWcag:"A",wcag:["1.1.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Lire la description sans regarder l\u2019image : restitue-t-elle toute l\u2019information v\xE9hicul\xE9e ?",casParticuliers:[],casParticuliersVerifie:!0,outils:["NVDA","manuel"]},{id:"1.8",thematique:"Images",intitule:"Chaque image texte porteuse d\u2019information, en l\u2019absence d\u2019un m\xE9canisme de remplacement, doit si possible \xEAtre remplac\xE9e par du texte styl\xE9. Cette r\xE8gle est-elle respect\xE9e (hors cas particuliers) ?",intituleCourt:"Image texte remplac\xE9e par du texte styl\xE9",niveauWcag:"AA",wcag:["1.4.5"],wcagVerifie:!0,methode:"manuel",commentTester:"Rep\xE9rer les textes int\xE9gr\xE9s dans une image bitmap et v\xE9rifier qu\u2019un rendu CSS \xE9quivalent \xE9tait impossible. Le texte r\xE9el d\u2019un SVG (\xE9l\xE9ments <text>) n\u2019est pas concern\xE9.",casParticuliers:["Le texte fait partie d\u2019un logo ou d\u2019une d\xE9nomination commerciale.","Le texte fait partie d\u2019un CAPTCHA ou d\u2019une image-test.","L\u2019exactitude graphique du texte est essentielle \xE0 la bonne transmission de l\u2019information v\xE9hicul\xE9e par l\u2019image."],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"1.9",thematique:"Images",intitule:"Chaque l\xE9gende d\u2019image est-elle, si n\xE9cessaire, correctement reli\xE9e \xE0 l\u2019image correspondante ?",intituleCourt:"L\xE9gende reli\xE9e \xE0 son image",niveauWcag:"A",wcag:["1.1.1","4.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:'L\u2019image et sa l\xE9gende doivent \xEAtre dans un <figure> portant role="figure" ou role="group" et un aria-label identique \xE0 la l\xE9gende, elle-m\xEAme dans <figcaption>. La structure se d\xE9tecte automatiquement, la correspondance des textes se v\xE9rifie \xE0 l\u2019\u0153il.',casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"2.1",thematique:"Cadres",intitule:"Chaque cadre a-t-il un titre de cadre ?",intituleCourt:"Titre de cadre pr\xE9sent",niveauWcag:"A",wcag:["4.1.2"],wcagVerifie:!0,methode:"auto",commentTester:"V\xE9rifier que chaque <iframe> et <frame> poss\xE8de un attribut title. Enti\xE8rement automatisable.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"2.2",thematique:"Cadres",intitule:"Pour chaque cadre ayant un titre de cadre, ce titre de cadre est-il pertinent ?",intituleCourt:"Pertinence du titre de cadre",niveauWcag:"A",wcag:["4.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Le title doit d\xE9crire le contenu r\xE9el du cadre. Un titre g\xE9n\xE9rique comme \xAB iframe \xBB ou \xAB contenu int\xE9gr\xE9 \xBB invalide le crit\xE8re.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"3.1",thematique:"Couleurs",intitule:"Dans chaque page web, l\u2019information ne doit pas \xEAtre donn\xE9e uniquement par la couleur. Cette r\xE8gle est-elle respect\xE9e ?",intituleCourt:"Information non port\xE9e par la seule couleur",niveauWcag:"A",wcag:["1.3.1","1.4.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Passer la page en niveaux de gris et v\xE9rifier que rien ne se perd : liens dans le texte, champs en erreur, \xE9tats, courbes et l\xE9gendes de graphiques. Doubler la couleur par du texte, une forme, une ic\xF4ne ou un effet typographique.",casParticuliers:[],casParticuliersVerifie:!0,outils:["simulateur","manuel"]},{id:"3.2",thematique:"Couleurs",intitule:"Dans chaque page web, le contraste entre la couleur du texte et la couleur de son arri\xE8re-plan est-il suffisamment \xE9lev\xE9 (hors cas particuliers) ?",intituleCourt:"Contraste texte / arri\xE8re-plan",niveauWcag:"AA",wcag:["1.4.3"],wcagVerifie:!0,methode:"mixte",commentTester:"Seuils RGAA en taille restitu\xE9e : 4.5:1 sous 24px (ou sous 18,5px en gras), 3:1 au-del\xE0. Les outils automatiques manquent le texte sur image, les d\xE9grad\xE9s et les \xE9tats.",casParticuliers:["Le texte fait partie d\u2019un logo ou d\u2019un nom de marque d\u2019un organisme ou d\u2019une soci\xE9t\xE9.","Le texte ou l\u2019image de texte est purement d\xE9coratif.","Le texte fait partie d\u2019une image v\xE9hiculant une information, mais le texte lui-m\xEAme n\u2019apporte aucune information essentielle.","Le texte ou l\u2019image de texte fait partie d\u2019un \xE9l\xE9ment d\u2019interface sur lequel aucune action n\u2019est possible (bouton disabled, par exemple)."],casParticuliersVerifie:!0,outils:["contraste","axe","inspecteur"]},{id:"3.3",thematique:"Couleurs",intitule:"Dans chaque page web, les couleurs utilis\xE9es dans les composants d\u2019interface ou les \xE9l\xE9ments graphiques porteurs d\u2019informations sont-elles suffisamment contrast\xE9es (hors cas particuliers) ?",intituleCourt:"Contraste des composants et \xE9l\xE9ments graphiques",niveauWcag:"AA",wcag:["1.4.11"],wcagVerifie:!0,methode:"mixte",commentTester:"3:1 minimum pour les bordures de champs, contours de boutons, pictogrammes et couleurs de graphiques, dans TOUS les \xE9tats (repos, survol, focus, actif). Attention : un lien textuel rel\xE8ve de 3.2, pas de 3.3.",casParticuliers:[],casParticuliersVerifie:!1,outils:["contraste","inspecteur","manuel"]},{id:"4.1",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia temporel pr\xE9-enregistr\xE9 a-t-il, si n\xE9cessaire, une transcription textuelle ou une audiodescription (hors cas particuliers) ?",intituleCourt:"Transcription ou audiodescription",niveauWcag:"A",wcag:["1.2.1","1.2.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Pour chaque audio ou vid\xE9o pr\xE9-enregistr\xE9, chercher une transcription textuelle ou une audiodescription, accessible via un lien/bouton adjacent ou clairement identifiable \xE0 c\xF4t\xE9 du m\xE9dia.",casParticuliers:["Le m\xE9dia temporel est utilis\xE9 \xE0 des fins d\xE9coratives et n\u2019apporte aucune information.","Le m\xE9dia temporel est lui-m\xEAme une alternative \xE0 un contenu de la page (vid\xE9o en langue des signes, vocalisation d\u2019un texte).","Le m\xE9dia temporel est utilis\xE9 pour acc\xE9der \xE0 une version agrandie.","Le m\xE9dia temporel est utilis\xE9 comme CAPTCHA.","Le m\xE9dia temporel fait partie d\u2019un test qui deviendrait inutile si la transcription, les sous-titres ou l\u2019audiodescription \xE9taient communiqu\xE9s.","Exemption li\xE9e \xE0 la date de publication : pour l\u2019\xC9tat et les collectivit\xE9s, m\xE9dia publi\xE9 entre le 23/09/2019 et le 23/09/2020 sur un site cr\xE9\xE9 depuis le 23/09/2018 ; pour les personnes de droit priv\xE9 vis\xE9es par l\u2019article 47, m\xE9dia publi\xE9 avant le 23/09/2020."],casParticuliersVerifie:!0,naChampsRequis:["dateMedia","secteur"],outils:["manuel"]},{id:"4.2",thematique:"Multim\xE9dia",intitule:"Pour chaque m\xE9dia temporel pr\xE9-enregistr\xE9 ayant une transcription textuelle ou une audiodescription synchronis\xE9e, celles-ci sont-elles pertinentes (hors cas particuliers) ?",intituleCourt:"Pertinence de la transcription / audiodescription",niveauWcag:"A",wcag:["1.2.1","1.2.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Lire la transcription sans consulter le m\xE9dia : toute l\u2019information doit \xEAtre l\xE0, dialogues comme sons signifiants. Une transcription auto-g\xE9n\xE9r\xE9e non relue \xE9choue presque toujours.",casParticuliers:["M\xEAmes cas particuliers que le crit\xE8re 4.1 (m\xE9dia d\xE9coratif, alternative, version agrandie, CAPTCHA, test, exemptions de date)."],casParticuliersVerifie:!0,naChampsRequis:["dateMedia","secteur"],outils:["manuel"]},{id:"4.3",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia temporel synchronis\xE9 pr\xE9-enregistr\xE9 a-t-il, si n\xE9cessaire, des sous-titres synchronis\xE9s (hors cas particuliers) ?",intituleCourt:"Sous-titres synchronis\xE9s",niveauWcag:"A",wcag:["1.2.2"],wcagVerifie:!0,methode:"manuel",commentTester:'Concerne les vid\xE9os avec bande son. V\xE9rifier la pr\xE9sence de sous-titres synchronis\xE9s (piste <track kind="captions"> ou sous-titres int\xE9gr\xE9s au lecteur), pas d\u2019un simple fichier joint.',casParticuliers:["M\xEAmes cas particuliers que le crit\xE8re 4.1 (m\xE9dia d\xE9coratif, alternative, version agrandie, CAPTCHA, test, exemptions de date)."],casParticuliersVerifie:!0,naChampsRequis:["dateMedia","secteur"],outils:["inspecteur","manuel"]},{id:"4.4",thematique:"Multim\xE9dia",intitule:"Pour chaque m\xE9dia temporel synchronis\xE9 pr\xE9-enregistr\xE9 ayant des sous-titres synchronis\xE9s, ces sous-titres sont-ils pertinents ?",intituleCourt:"Pertinence des sous-titres",niveauWcag:"A",wcag:["1.2.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Couper le son et regarder : les sous-titres doivent \xEAtre synchronis\xE9s, fid\xE8les, identifier les locuteurs et signaler les sons porteurs de sens.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"4.5",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia temporel pr\xE9-enregistr\xE9 a-t-il, si n\xE9cessaire, une audiodescription synchronis\xE9e (hors cas particuliers) ?",intituleCourt:"Audiodescription synchronis\xE9e",niveauWcag:"AA",wcag:["1.2.5"],wcagVerifie:!0,methode:"manuel",commentTester:"N\xE9cessaire quand des informations sont uniquement visuelles (texte \xE0 l\u2019\xE9cran, action muette). V\xE9rifier une piste d\u2019audiodescription ou une version alternative qui en comporte une.",casParticuliers:["M\xEAmes cas particuliers que le crit\xE8re 4.1 (m\xE9dia d\xE9coratif, alternative, version agrandie, CAPTCHA, test, exemptions de date)."],casParticuliersVerifie:!0,naChampsRequis:["dateMedia","secteur"],outils:["manuel"]},{id:"4.6",thematique:"Multim\xE9dia",intitule:"Pour chaque m\xE9dia temporel pr\xE9-enregistr\xE9 ayant une audiodescription synchronis\xE9e, celle-ci est-elle pertinente ?",intituleCourt:"Pertinence de l\u2019audiodescription",niveauWcag:"AA",wcag:["1.2.5"],wcagVerifie:!0,methode:"manuel",commentTester:"\xC9couter sans regarder l\u2019\xE9cran : l\u2019audiodescription doit couvrir toute l\u2019information visuelle essentielle, dans les silences de la bande son.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"4.7",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia temporel est-il clairement identifiable (hors cas particuliers) ?",intituleCourt:"M\xE9dia temporel clairement identifiable",niveauWcag:"A",wcag:["1.1.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Un titre ou un texte adjacent doit permettre de savoir de quel m\xE9dia il s\u2019agit avant de le lancer.",casParticuliers:[],casParticuliersVerifie:!1,outils:["manuel"]},{id:"4.8",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia non temporel a-t-il, si n\xE9cessaire, une alternative (hors cas particuliers) ?",intituleCourt:"Alternative au m\xE9dia non temporel",niveauWcag:"A",wcag:["1.1.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Vise les contenus interactifs sans dimension temporelle (applet, visionneuse, contenu embarqu\xE9). V\xE9rifier qu\u2019une alternative accessible existe \xE0 proximit\xE9.",casParticuliers:[],casParticuliersVerifie:!1,outils:["manuel"]},{id:"4.9",thematique:"Multim\xE9dia",intitule:"Pour chaque m\xE9dia non temporel ayant une alternative, cette alternative est-elle pertinente ?",intituleCourt:"Pertinence de l\u2019alternative (m\xE9dia non temporel)",niveauWcag:"A",wcag:["1.1.1"],wcagVerifie:!0,methode:"manuel",commentTester:"L\u2019alternative doit donner acc\xE8s \xE0 la m\xEAme information et aux m\xEAmes fonctionnalit\xE9s que le m\xE9dia d\u2019origine.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"4.10",thematique:"Multim\xE9dia",intitule:"Chaque son d\xE9clench\xE9 automatiquement est-il contr\xF4lable par l\u2019utilisateur ?",intituleCourt:"Son d\xE9clench\xE9 automatiquement contr\xF4lable",niveauWcag:"A",wcag:["1.4.2"],wcagVerifie:!0,methode:"mixte",commentTester:"Tout son d\xE9marrant seul et durant plus de 3 secondes doit pouvoir \xEAtre arr\xEAt\xE9 ou son volume r\xE9gl\xE9 ind\xE9pendamment du syst\xE8me, par un contr\xF4le accessible au clavier et plac\xE9 t\xF4t dans l\u2019ordre de tabulation.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","inspecteur","manuel"]},{id:"4.11",thematique:"Multim\xE9dia",intitule:"La consultation de chaque m\xE9dia temporel est-elle, si n\xE9cessaire, contr\xF4lable par le clavier et tout dispositif de pointage ?",intituleCourt:"M\xE9dia temporel contr\xF4lable au clavier",niveauWcag:"A",wcag:["2.1.1","2.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Atteindre le lecteur au clavier seul et actionner lecture, pause, volume, plein \xE9cran et sous-titres. V\xE9rifier aussi qu\u2019on peut ressortir du lecteur (pas de pi\xE8ge au clavier).",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"4.12",thematique:"Multim\xE9dia",intitule:"La consultation de chaque m\xE9dia non temporel est-elle contr\xF4lable par le clavier et tout dispositif de pointage ?",intituleCourt:"M\xE9dia non temporel contr\xF4lable au clavier",niveauWcag:"A",wcag:["2.1.1","2.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"M\xEAmes v\xE9rifications que 4.11, appliqu\xE9es aux m\xE9dias non temporels : acc\xE8s, pilotage complet et sortie au clavier.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"4.13",thematique:"Multim\xE9dia",intitule:"Chaque m\xE9dia temporel et non temporel est-il compatible avec les technologies d\u2019assistance (hors cas particuliers) ?",intituleCourt:"M\xE9dias compatibles avec les technologies d\u2019assistance",niveauWcag:"A",wcag:["4.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Parcourir le lecteur au lecteur d\u2019\xE9cran : chaque contr\xF4le doit avoir un nom, un r\xF4le et un \xE9tat restitu\xE9s, et l\u2019\xE9tat lecture/pause doit \xEAtre annonc\xE9.",casParticuliers:[],casParticuliersVerifie:!1,outils:["NVDA","manuel"]},{id:"5.1",thematique:"Tableaux",intitule:"Chaque tableau de donn\xE9es complexe a-t-il un r\xE9sum\xE9 ?",intituleCourt:"R\xE9sum\xE9 du tableau de donn\xE9es complexe",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Un tableau est complexe quand ses en-t\xEAtes ne se lisent pas sur une seule ligne et une seule colonne (en-t\xEAtes fusionn\xE9s ou \xE0 plusieurs niveaux). Juger la complexit\xE9 reste humain ; la pr\xE9sence du r\xE9sum\xE9 se d\xE9tecte.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"5.2",thematique:"Tableaux",intitule:"Pour chaque tableau de donn\xE9es complexe ayant un r\xE9sum\xE9, celui-ci est-il pertinent ?",intituleCourt:"Pertinence du r\xE9sum\xE9",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Le r\xE9sum\xE9 doit expliquer comment le tableau est organis\xE9, pas r\xE9p\xE9ter son titre : nature des en-t\xEAtes, niveaux, sens de lecture.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"5.3",thematique:"Tableaux",intitule:"Pour chaque tableau de mise en forme, le contenu lin\xE9aris\xE9 reste-t-il compr\xE9hensible ?",intituleCourt:"Tableau de mise en forme lin\xE9aris\xE9 compr\xE9hensible",niveauWcag:"A",wcag:["1.3.2"],wcagVerifie:!1,methode:"manuel",commentTester:"Lire le tableau cellule par cellule dans l'ordre du code, comme le ferait un lecteur d'\xE9cran : le sens doit tenir sans la grille visuelle.",casParticuliers:[],casParticuliersVerifie:!1,outils:["NVDA","manuel"]},{id:"5.4",thematique:"Tableaux",intitule:"Pour chaque tableau de donn\xE9es ayant un titre, le titre est-il correctement associ\xE9 au tableau de donn\xE9es ?",intituleCourt:"Titre associ\xE9 au tableau",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Le titre doit passer par un <caption> enfant direct du <table>, ou une association ARIA \xE9quivalente. La pr\xE9sence du caption se d\xE9tecte automatiquement.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"5.5",thematique:"Tableaux",intitule:"Pour chaque tableau de donn\xE9es ayant un titre, celui-ci est-il pertinent ?",intituleCourt:"Pertinence du titre du tableau",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Le titre doit permettre d'identifier le tableau parmi les autres de la page, sans avoir \xE0 le lire.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"5.6",thematique:"Tableaux",intitule:"Pour chaque tableau de donn\xE9es, chaque en-t\xEAte de colonnes et chaque en-t\xEAte de lignes sont-ils correctement d\xE9clar\xE9s ?",intituleCourt:"En-t\xEAtes de colonnes et de lignes d\xE9clar\xE9s",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:'Les en-t\xEAtes doivent \xEAtre des <th> (ou porter role="columnheader" / "rowheader"). Un <td> en gras ne fait pas un en-t\xEAte. Distinguer tableau de donn\xE9es et tableau de mise en forme reste humain.',casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"5.7",thematique:"Tableaux",intitule:"Pour chaque tableau de donn\xE9es, la technique appropri\xE9e permettant d'associer chaque cellule avec ses en-t\xEAtes est-elle utilis\xE9e (hors cas particuliers) ?",intituleCourt:"Association cellules / en-t\xEAtes",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:`Tableau simple : scope="col" / scope="row" suffit. Tableau complexe : couple headers / id obligatoire. V\xE9rifier la restitution r\xE9elle au lecteur d'\xE9cran, cellule par cellule.`,casParticuliers:[],casParticuliersVerifie:!1,outils:["axe","inspecteur","NVDA"]},{id:"5.8",thematique:"Tableaux",intitule:"Chaque tableau de mise en forme ne doit pas utiliser d'\xE9l\xE9ments propres aux tableaux de donn\xE9es. Cette r\xE8gle est-elle respect\xE9e ?",intituleCourt:"Tableau de mise en forme sans \xE9l\xE9ments de donn\xE9es",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:`Un tableau de mise en forme ne doit contenir ni th, ni caption, ni summary, ni scope, ni headers, et devrait porter role="presentation". Identifier qu'il s'agit d'un tableau de mise en forme reste humain.`,casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"6.1",thematique:"Liens",intitule:"Chaque lien est-il explicite (hors cas particuliers) ?",intituleCourt:"Lien explicite",niveauWcag:"A",wcag:["1.1.1","2.4.4","2.5.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Extraire la liste des liens hors contexte : chaque intitul\xE9 doit \xE0 lui seul dire o\xF9 il m\xE8ne. Proscrire \xAB cliquez ici \xBB, \xAB en savoir plus \xBB, \xAB lire la suite \xBB. V\xE9rifier aussi 2.5.3 : le nom accessible doit contenir le texte visible.",casParticuliers:[],casParticuliersVerifie:!1,outils:["NVDA","inspecteur","manuel"]},{id:"6.2",thematique:"Liens",intitule:"Dans chaque page web, chaque lien a-t-il un intitul\xE9 ?",intituleCourt:"Lien pourvu d'un intitul\xE9",niveauWcag:"A",wcag:["1.1.1","2.4.4"],wcagVerifie:!0,methode:"mixte",commentTester:"D\xE9tecter les liens sans nom accessible : liens-ic\xF4nes, liens sur image sans alt, liens vides. Les ancres pures sont exclues du p\xE9rim\xE8tre.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"7.1",thematique:"Scripts",intitule:"Chaque script est-il, si n\xE9cessaire, compatible avec les technologies d'assistance ?",intituleCourt:"Script compatible avec les technologies d'assistance",niveauWcag:"A",wcag:["2.5.3","4.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Pour chaque composant riche (onglets, accord\xE9on, modale, combobox, carrousel), v\xE9rifier au lecteur d'\xE9cran que nom, r\xF4le, valeur et \xE9tats sont corrects et mis \xE0 jour. Se r\xE9f\xE9rer aux ARIA Authoring Practices pour le motif attendu.",casParticuliers:[],casParticuliersVerifie:!0,outils:["NVDA","inspecteur","manuel"]},{id:"7.2",thematique:"Scripts",intitule:"Pour chaque script ayant une alternative, cette alternative est-elle pertinente ?",intituleCourt:"Pertinence de l'alternative au script",niveauWcag:"A",wcag:["1.1.1","4.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"L'alternative doit offrir la m\xEAme information et les m\xEAmes fonctionnalit\xE9s que le composant script\xE9, pas une version d\xE9grad\xE9e.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"7.3",thematique:"Scripts",intitule:"Chaque script est-il contr\xF4lable par le clavier et par tout dispositif de pointage (hors cas particuliers) ?",intituleCourt:"Script contr\xF4lable au clavier",niveauWcag:"AA",wcag:["1.3.1","2.1.1","2.4.7"],wcagVerifie:!1,methode:"manuel",commentTester:"Parcourir chaque composant script\xE9 au clavier seul : atteindre, activer, naviguer \xE0 l'int\xE9rieur, ressortir. Le focus doit rester visible \xE0 chaque \xE9tape.",casParticuliers:[],casParticuliersVerifie:!1,outils:["clavier","manuel"]},{id:"7.4",thematique:"Scripts",intitule:"Pour chaque script qui initie un changement de contexte, l'utilisateur est-il averti ou en a-t-il le contr\xF4le ?",intituleCourt:"Changement de contexte ma\xEEtris\xE9",niveauWcag:"A",wcag:["3.2.1","3.2.2"],wcagVerifie:!1,methode:"manuel",commentTester:"Aucun changement de contexte ne doit survenir \xE0 la simple prise de focus ou \xE0 la saisie : pas de soumission automatique au changement de <select>, pas de redirection au focus. Sinon, pr\xE9venir l'utilisateur avant.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"7.5",thematique:"Scripts",intitule:"Dans chaque page web, les messages de statut sont-ils correctement restitu\xE9s par les technologies d'assistance ?",intituleCourt:"Messages de statut restitu\xE9s",niveauWcag:"AA",wcag:["4.1.3"],wcagVerifie:!0,methode:"manuel",commentTester:`Confirmations, erreurs de validation, compteurs de r\xE9sultats et indicateurs de chargement doivent \xEAtre annonc\xE9s sans d\xE9placer le focus : role="status", role="alert" ou aria-live. Le vrai test se fait lecteur d'\xE9cran allum\xE9.`,casParticuliers:[],casParticuliersVerifie:!0,outils:["NVDA","inspecteur"]},{id:"8.1",thematique:"\xC9l\xE9ments obligatoires",intitule:"Chaque page web est-elle d\xE9finie par un type de document ?",intituleCourt:"Type de document d\xE9clar\xE9",niveauWcag:"A",wcag:["4.1.1"],wcagVerifie:!0,methode:"auto",commentTester:"V\xE9rifier la pr\xE9sence d'un <!DOCTYPE html> en premi\xE8re ligne, avant la balise <html>. Note : le SC 4.1.1 Parsing a \xE9t\xE9 retir\xE9 par WCAG 2.2, mais il existe bien dans WCAG 2.1, r\xE9f\xE9rence normative du RGAA 4.1.2. Le crit\xE8re reste opposable.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","validateur W3C"]},{id:"8.2",thematique:"\xC9l\xE9ments obligatoires",intitule:"Pour chaque page web, le code source g\xE9n\xE9r\xE9 est-il valide selon le type de document sp\xE9cifi\xE9 ?",intituleCourt:"Code source valide",niveauWcag:"A",wcag:["4.1.1","4.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:"Passer le code g\xE9n\xE9r\xE9 (pas le source serveur) au validateur W3C. La validation est automatisable ; d\xE9cider quelles erreurs rel\xE8vent d'un cas particulier ne l'est pas.",casParticuliers:[],casParticuliersVerifie:!1,outils:["validateur W3C","inspecteur"]},{id:"8.3",thematique:"\xC9l\xE9ments obligatoires",intitule:"Dans chaque page web, la langue par d\xE9faut est-elle pr\xE9sente ?",intituleCourt:"Langue par d\xE9faut pr\xE9sente",niveauWcag:"A",wcag:["3.1.1"],wcagVerifie:!0,methode:"auto",commentTester:"V\xE9rifier la pr\xE9sence d'un attribut lang (ou xml:lang) sur l'\xE9l\xE9ment <html>. Enti\xE8rement automatisable.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"8.4",thematique:"\xC9l\xE9ments obligatoires",intitule:"Pour chaque page web ayant une langue par d\xE9faut, le code de langue est-il pertinent ?",intituleCourt:"Pertinence du code de langue",niveauWcag:"A",wcag:["3.1.1"],wcagVerifie:!0,methode:"mixte",commentTester:'La validit\xE9 du code (fr, en, es\u2026) se contr\xF4le automatiquement ; sa pertinence non : lang="en" sur une page r\xE9dig\xE9e en fran\xE7ais est valide mais faux, et fait lire la page avec une voix anglaise.',casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","NVDA"]},{id:"8.5",thematique:"\xC9l\xE9ments obligatoires",intitule:"Chaque page web a-t-elle un titre de page ?",intituleCourt:"Titre de page pr\xE9sent",niveauWcag:"A",wcag:["2.4.2"],wcagVerifie:!0,methode:"auto",commentTester:"V\xE9rifier la pr\xE9sence d'un \xE9l\xE9ment <title> non vide dans le <head>. Enti\xE8rement automatisable.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"8.6",thematique:"\xC9l\xE9ments obligatoires",intitule:"Pour chaque page web ayant un titre de page, ce titre est-il pertinent ?",intituleCourt:"Pertinence du titre de page",niveauWcag:"A",wcag:["2.4.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Le titre doit identifier la page de fa\xE7on unique dans le site, l'information la plus sp\xE9cifique en premier. Un m\xEAme titre sur plusieurs pages invalide le crit\xE8re.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"8.7",thematique:"\xC9l\xE9ments obligatoires",intitule:"Dans chaque page web, chaque changement de langue est-il indiqu\xE9 dans le code source (hors cas particuliers) ?",intituleCourt:"Changements de langue signal\xE9s",niveauWcag:"AA",wcag:["3.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"Rep\xE9rer les passages r\xE9dig\xE9s dans une autre langue que celle de la page et v\xE9rifier qu'ils portent un attribut lang. D\xE9tecter ces passages exige une lecture humaine.",casParticuliers:[],casParticuliersVerifie:!1,outils:["inspecteur","NVDA","manuel"]},{id:"8.8",thematique:"\xC9l\xE9ments obligatoires",intitule:"Dans chaque page web, le code de langue de chaque changement de langue est-il valide et pertinent ?",intituleCourt:"Codes de langue valides et pertinents",niveauWcag:"AA",wcag:["3.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:"La validit\xE9 du code se v\xE9rifie automatiquement, sa correspondance avec la langue r\xE9elle du passage se lit \xE0 l'\u0153il.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","NVDA"]},{id:"8.9",thematique:"\xC9l\xE9ments obligatoires",intitule:"Dans chaque page web, les balises ne doivent pas \xEAtre utilis\xE9es uniquement \xE0 des fins de pr\xE9sentation. Cette r\xE8gle est-elle respect\xE9e ?",intituleCourt:"Balises non d\xE9tourn\xE9es \xE0 des fins de pr\xE9sentation",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Traquer les balises s\xE9mantiques utilis\xE9es pour l'apparence : <table> pour la mise en page, <blockquote> pour indenter, <hN> pour grossir un texte, <ul> pour aligner. La d\xE9tection oriente, la confirmation est humaine.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"8.10",thematique:"\xC9l\xE9ments obligatoires",intitule:"Dans chaque page web, les changements du sens de lecture sont-ils signal\xE9s ?",intituleCourt:"Changements du sens de lecture signal\xE9s",niveauWcag:"A",wcag:["1.3.2"],wcagVerifie:!0,methode:"manuel",commentTester:`Un passage en arabe, h\xE9breu ou persan ins\xE9r\xE9 dans un texte latin doit porter dir="rtl". Non applicable si la page ne m\xE9lange aucun sens d'\xE9criture.`,casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"9.1",thematique:"Structuration de l\u2019information",intitule:"Dans chaque page web, l\u2019information est-elle structur\xE9e par l\u2019utilisation appropri\xE9e de titres ?",intituleCourt:"Information structur\xE9e par des titres",niveauWcag:"AA",wcag:["1.3.1","2.4.1","2.4.6","4.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:"La hi\xE9rarchie h1\u2013h6 et les sauts de niveau se d\xE9tectent automatiquement. Reste humain : v\xE9rifier qu'aucun contenu faisant office de titre n'a \xE9t\xE9 laiss\xE9 en <p> styl\xE9, et que chaque titre d\xE9crit bien sa section.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"9.2",thematique:"Structuration de l\u2019information",intitule:"Dans chaque page web, la structure du document est-elle coh\xE9rente (hors cas particuliers) ?",intituleCourt:"Structure du document coh\xE9rente",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"V\xE9rifier la pr\xE9sence et l'unicit\xE9 des r\xE9gions : <header>, <nav>, <main>, <footer>, ou leurs r\xF4les ARIA \xE9quivalents. La d\xE9tection est automatique, l'ad\xE9quation au contenu r\xE9el ne l'est pas.",casParticuliers:[],casParticuliersVerifie:!1,outils:["axe","inspecteur","NVDA"]},{id:"9.3",thematique:"Structuration de l\u2019information",intitule:"Dans chaque page web, chaque liste est-elle correctement structur\xE9e ?",intituleCourt:"Listes correctement structur\xE9es",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Toute \xE9num\xE9ration visuelle doit \xEAtre un <ul>, <ol> ou <dl> ; <li> uniquement enfant direct de <ul>/<ol> ; <dt>/<dd> correctement appari\xE9s. Une suite de <p> commen\xE7ant par un tiret invalide le crit\xE8re.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"9.4",thematique:"Structuration de l\u2019information",intitule:"Dans chaque page web, chaque citation est-elle correctement indiqu\xE9e ?",intituleCourt:"Citations correctement indiqu\xE9es",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Citation en ligne : <q>. Bloc de citation : <blockquote>. L'attribut cite peut porter la source. Identifier ce qui est une citation exige une lecture du contenu.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"10.1",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans le site web, des feuilles de styles sont-elles utilis\xE9es pour contr\xF4ler la pr\xE9sentation de l\u2019information ?",intituleCourt:"Pr\xE9sentation contr\xF4l\xE9e par CSS",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Traquer les attributs de pr\xE9sentation obsol\xE8tes dans le HTML : align, bgcolor, border, frameborder, cellpadding, <font>, <center>. Leur d\xE9tection est automatisable ; leur caract\xE8re purement pr\xE9sentationnel se confirme \xE0 l'\u0153il.",casParticuliers:[],casParticuliersVerifie:!0,outils:["validateur W3C","inspecteur"]},{id:"10.2",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, le contenu visible reste-t-il pr\xE9sent lorsque les feuilles de styles sont d\xE9sactiv\xE9es ?",intituleCourt:"Contenu visible pr\xE9sent sans CSS",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"D\xE9sactiver les CSS et comparer : rien ne doit dispara\xEEtre. Pi\xE8ge classique \u2014 les ic\xF4nes de r\xE9seaux sociaux pos\xE9es en background-image s'\xE9vaporent, et avec elles le lien.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"10.3",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, l\u2019information reste-t-elle compr\xE9hensible lorsque les feuilles de styles sont d\xE9sactiv\xE9es ?",intituleCourt:"Information compr\xE9hensible sans CSS",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"CSS d\xE9sactiv\xE9es, lire la page de haut en bas : l'ordre du code doit produire une lecture sens\xE9e. Un contenu d\xE9plac\xE9 visuellement par flex/grid peut se retrouver hors contexte.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"10.4",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, le texte reste-t-il lisible lorsque la taille des caract\xE8res est augment\xE9e jusqu\u2019\xE0 200%, au moins (hors cas particuliers) ?",intituleCourt:"Texte lisible \xE0 200 %",niveauWcag:"AA",wcag:["1.4.4"],wcagVerifie:!0,methode:"manuel",commentTester:"Zoomer le texte \xE0 200 % (Ctrl + +) et v\xE9rifier qu'aucun contenu n'est tronqu\xE9, superpos\xE9 ou perdu. Tester sur plusieurs largeurs : un composant peut dispara\xEEtre \xE0 1600px zoom\xE9 et survivre \xE0 1280px.",casParticuliers:[],casParticuliersVerifie:!1,outils:["navigateur","manuel"]},{id:"10.5",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, les d\xE9clarations CSS de couleurs de fond d\u2019\xE9l\xE9ment et de police sont-elles correctement utilis\xE9es ?",intituleCourt:"D\xE9clarations CSS de couleurs correctes",niveauWcag:"AA",wcag:["1.4.3"],wcagVerifie:!0,methode:"mixte",commentTester:"Toute couleur de police d\xE9clar\xE9e doit s'accompagner d'une couleur de fond, et inversement. Test d\xE9cisif : d\xE9sactiver les images de fond \u2014 du texte blanc sur image devient blanc sur blanc.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","contraste"]},{id:"10.6",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, chaque lien dont la nature n\u2019est pas \xE9vidente est-il visible par rapport au texte environnant ?",intituleCourt:"Lien visible dans le texte environnant",niveauWcag:"A",wcag:["1.4.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Un lien noy\xE9 dans un paragraphe doit se distinguer autrement que par la couleur seule, ou bien atteindre 3:1 avec le texte environnant ET changer d'apparence au survol et au focus. Le calcul du ratio est automatisable, l'identification des liens \xAB non \xE9vidents \xBB ne l'est pas.",casParticuliers:[],casParticuliersVerifie:!0,outils:["contraste","manuel"]},{id:"10.7",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, pour chaque \xE9l\xE9ment recevant le focus, la prise de focus est-elle visible ?",intituleCourt:"Prise de focus visible",niveauWcag:"AA",wcag:["2.4.7"],wcagVerifie:!1,methode:"manuel",commentTester:"Parcourir toute la page \xE0 la touche Tab : \xE0 chaque arr\xEAt, l'\xE9l\xE9ment focus\xE9 doit \xEAtre visuellement identifiable. Un outline:none non remplac\xE9 suffit \xE0 faire \xE9chouer le crit\xE8re sur l'ensemble du site.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"10.8",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Pour chaque page web, les contenus cach\xE9s ont-ils vocation \xE0 \xEAtre ignor\xE9s par les technologies d\u2019assistance ?",intituleCourt:"Contenus cach\xE9s correctement ignor\xE9s",niveauWcag:"A",wcag:["1.3.1","4.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:"Distinguer trois cas : cach\xE9 pour tous (display:none, aria-hidden), cach\xE9 visuellement mais lu (classe sr-only), et visible mais masqu\xE9 aux lecteurs d'\xE9cran. Chaque contenu cach\xE9 doit relever du bon cas.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","NVDA"]},{id:"10.9",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, l\u2019information ne doit pas \xEAtre donn\xE9e uniquement par la forme, taille ou position. Cette r\xE8gle est-elle respect\xE9e ?",intituleCourt:"Information non port\xE9e par forme, taille ou position",niveauWcag:"A",wcag:["1.3.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Proscrire \xAB le bouton \xE0 droite \xBB, \xAB le bloc ci-dessous \xBB, \xAB le champ le plus large \xBB. Cas typique : dans une pagination, la page courante signal\xE9e uniquement par un fond diff\xE9rent \u2014 il faut aria-current.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"10.10",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, l\u2019information ne doit pas \xEAtre donn\xE9e par la forme, taille ou position uniquement. Cette r\xE8gle est-elle impl\xE9ment\xE9e de fa\xE7on pertinente ?",intituleCourt:"Pertinence de l\u2019impl\xE9mentation (forme, taille, position)",niveauWcag:"A",wcag:["1.3.3"],wcagVerifie:!0,methode:"manuel",commentTester:"V\xE9rifier que le doublage pr\xE9vu au crit\xE8re 10.9 est effectivement restitu\xE9 : le texte de substitution doit \xEAtre lu par la synth\xE8se vocale, pas seulement pr\xE9sent dans le code.",casParticuliers:[],casParticuliersVerifie:!0,outils:["NVDA","manuel"]},{id:"10.11",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Pour chaque page web, les contenus peuvent-ils \xEAtre pr\xE9sent\xE9s sans perte d\u2019information ou de fonctionnalit\xE9 et sans avoir recours soit \xE0 un d\xE9filement vertical pour une fen\xEAtre ayant une hauteur de 256 px, soit \xE0 un d\xE9filement horizontal pour une fen\xEAtre ayant une largeur de 320 px (hors cas particuliers) ?",intituleCourt:"Reflow sans d\xE9filement bidirectionnel",niveauWcag:"AA",wcag:["1.4.10"],wcagVerifie:!0,methode:"manuel",commentTester:"Aucun outil ne v\xE9rifie ce crit\xE8re. R\xE9duire r\xE9ellement la fen\xEAtre \xE0 320px de large, puis \xE0 256px de haut, et parcourir la page : aucun contenu tronqu\xE9, aucun d\xE9filement dans les deux axes \xE0 la fois. Le zoom navigateur \xE0 400 % \xE9quivaut \xE0 320px.",casParticuliers:[],casParticuliersVerifie:!1,outils:["navigateur","manuel"]},{id:"10.12",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, les propri\xE9t\xE9s d\u2019espacement du texte peuvent-elles \xEAtre red\xE9finies par l\u2019utilisateur sans perte de contenu ou de fonctionnalit\xE9 (hors cas particuliers) ?",intituleCourt:"Espacement du texte red\xE9finissable",niveauWcag:"AA",wcag:["1.4.12"],wcagVerifie:!0,methode:"manuel",commentTester:"Aucun outil ne le v\xE9rifie. Appliquer le bookmarklet d'espacement (interligne 1.5, espacement des paragraphes 2, des lettres 0.12em, des mots 0.16em) puis relire la page : rien ne doit \xEAtre tronqu\xE9 ni superpos\xE9. Coupable habituel : white-space: nowrap.",casParticuliers:[],casParticuliersVerifie:!1,outils:["bookmarklet","manuel"]},{id:"10.13",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, les contenus additionnels apparaissant \xE0 la prise de focus ou au survol d\u2019un composant d\u2019interface sont-ils contr\xF4lables par l\u2019utilisateur (hors cas particuliers) ?",intituleCourt:"Contenus additionnels au survol/focus contr\xF4lables",niveauWcag:"AA",wcag:["1.4.13"],wcagVerifie:!0,methode:"manuel",commentTester:"Trois conditions cumulatives pour chaque infobulle ou sous-menu : masquable (\xC9chap sans bouger le pointeur ni le focus), survolable (le pointeur peut entrer dedans sans le faire dispara\xEEtre), persistant (reste tant que l'utilisateur ne l'a pas quitt\xE9).",casParticuliers:[],casParticuliersVerifie:!1,outils:["clavier","manuel"]},{id:"10.14",thematique:"Pr\xE9sentation de l\u2019information",intitule:"Dans chaque page web, les contenus additionnels apparaissant via les styles CSS uniquement peuvent-ils \xEAtre rendus visibles au clavier et par tout dispositif de pointage ?",intituleCourt:"Contenus additionnels CSS accessibles au clavier",niveauWcag:"A",wcag:[],wcagVerifie:!1,methode:"manuel",commentTester:"Un contenu r\xE9v\xE9l\xE9 par :hover en CSS doit l'\xEAtre aussi par :focus et :focus-within. Tester au clavier seul sur chaque menu d\xE9roulant et chaque infobulle purement CSS.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","inspecteur"]},{id:"11.1",thematique:"Formulaires",intitule:"Chaque champ de formulaire a-t-il une \xE9tiquette ?",intituleCourt:"\xC9tiquette de champ pr\xE9sente",niveauWcag:"A",wcag:["1.3.1","3.3.2","4.1.2"],wcagVerifie:!0,methode:"mixte",commentTester:"Chaque input (hors hidden/submit/button), select et textarea doit avoir un nom accessible : <label for>, aria-label, aria-labelledby ou title. La pr\xE9sence se d\xE9tecte, mais un placeholder seul ne suffit pas.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"11.2",thematique:"Formulaires",intitule:"Chaque \xE9tiquette associ\xE9e \xE0 un champ de formulaire est-elle pertinente (hors cas particuliers) ?",intituleCourt:"Pertinence de l'\xE9tiquette",niveauWcag:"A",wcag:["1.3.1","3.3.2"],wcagVerifie:!1,methode:"manuel",commentTester:"L'\xE9tiquette doit d\xE9crire ce qu'on attend dans le champ, de fa\xE7on concise. \xAB Nom \xBB, \xAB E-mail \xBB sont pertinents ; \xAB Champ 1 \xBB ne l'est pas.",casParticuliers:[],casParticuliersVerifie:!1,outils:["manuel"]},{id:"11.3",thematique:"Formulaires",intitule:"Dans chaque formulaire, chaque \xE9tiquette associ\xE9e \xE0 un champ de formulaire ayant la m\xEAme fonction et r\xE9p\xE9t\xE9 plusieurs fois dans une m\xEAme page ou dans un ensemble de pages est-elle coh\xE9rente ?",intituleCourt:"Coh\xE9rence des \xE9tiquettes r\xE9p\xE9t\xE9es",niveauWcag:"AA",wcag:["3.2.4"],wcagVerifie:!1,methode:"manuel",commentTester:"Un m\xEAme champ r\xE9p\xE9t\xE9 (recherche, e-mail) doit porter partout la m\xEAme \xE9tiquette. Comparer les libell\xE9s d'une page \xE0 l'autre.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"11.4",thematique:"Formulaires",intitule:"Dans chaque formulaire, chaque \xE9tiquette de champ et son champ associ\xE9 sont-ils accol\xE9s (hors cas particuliers) ?",intituleCourt:"\xC9tiquette accol\xE9e au champ",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!1,methode:"manuel",commentTester:"L'\xE9tiquette doit \xEAtre visuellement contigu\xEB \xE0 son champ, sans \xE9l\xE9ment intercal\xE9, pour les personnes en vision agrandie ou \xE0 la loupe d'\xE9cran.",casParticuliers:[],casParticuliersVerifie:!1,outils:["manuel"]},{id:"11.5",thematique:"Formulaires",intitule:"Dans chaque formulaire, les champs de m\xEAme nature sont-ils regroup\xE9s, si n\xE9cessaire ?",intituleCourt:"Regroupement des champs de m\xEAme nature",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:'Les champs li\xE9s (adresse, cases \xE0 cocher, boutons radio) doivent \xEAtre regroup\xE9s dans un <fieldset> ou role="group" / "radiogroup". Juger la n\xE9cessit\xE9 reste humain.',casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"11.6",thematique:"Formulaires",intitule:"Dans chaque formulaire, chaque regroupement de champs de formulaire a-t-il une l\xE9gende ?",intituleCourt:"L\xE9gende de regroupement pr\xE9sente",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:'Chaque <fieldset> doit avoir un <legend> ; chaque role="group" / "radiogroup" un aria-label ou aria-labelledby. La pr\xE9sence se d\xE9tecte automatiquement.',casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"11.7",thematique:"Formulaires",intitule:"Dans chaque formulaire, chaque l\xE9gende associ\xE9e \xE0 un regroupement de champs de m\xEAme nature est-elle pertinente ?",intituleCourt:"Pertinence de la l\xE9gende de regroupement",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!1,methode:"manuel",commentTester:"La l\xE9gende du regroupement doit d\xE9crire ce qui relie les champs (\xAB Adresse de livraison \xBB, \xAB Civilit\xE9 \xBB).",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"11.8",thematique:"Formulaires",intitule:"Dans chaque formulaire, les items de m\xEAme nature d'une liste de choix sont-ils regroup\xE9s de mani\xE8re pertinente ?",intituleCourt:"Regroupement des items d'une liste de choix",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Dans un <select> long, les <option> de m\xEAme nature doivent \xEAtre regroup\xE9es par <optgroup> portant un label pertinent.",casParticuliers:[],casParticuliersVerifie:!0,outils:["inspecteur","manuel"]},{id:"11.9",thematique:"Formulaires",intitule:"Dans chaque formulaire, l'intitul\xE9 de chaque bouton est-il pertinent (hors cas particuliers) ?",intituleCourt:"Pertinence de l'intitul\xE9 de bouton",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!1,methode:"manuel",commentTester:"Chaque bouton (submit, reset, <button>) doit annoncer son action : \xAB Rechercher \xBB, \xAB Envoyer le formulaire \xBB. Un bouton-loupe sans intitul\xE9 accessible \xE9choue.",casParticuliers:[],casParticuliersVerifie:!1,outils:["inspecteur","NVDA","manuel"]},{id:"11.10",thematique:"Formulaires",intitule:"Dans chaque formulaire, le contr\xF4le de saisie est-il utilis\xE9 de mani\xE8re pertinente (hors cas particuliers) ?",intituleCourt:"Contr\xF4le de saisie pertinent",niveauWcag:"AA",wcag:["3.3.1","3.3.2"],wcagVerifie:!1,methode:"manuel",commentTester:"Champs obligatoires signal\xE9s dans l'\xE9tiquette, format attendu indiqu\xE9, erreurs identifi\xE9es en texte et reli\xE9es au champ (aria-describedby, aria-invalid).",casParticuliers:[],casParticuliersVerifie:!1,outils:["NVDA","inspecteur","manuel"]},{id:"11.11",thematique:"Formulaires",intitule:"Dans chaque formulaire, le contr\xF4le de saisie est-il accompagn\xE9, si n\xE9cessaire, de suggestions facilitant la correction des erreurs de saisie ?",intituleCourt:"Suggestions de correction d'erreur",niveauWcag:"AA",wcag:["3.3.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Quand la saisie est invalide (e-mail, date), proposer une correction ou un exemple de format valide, \xE0 proximit\xE9 du champ.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"11.12",thematique:"Formulaires",intitule:"Pour chaque formulaire qui modifie ou supprime des donn\xE9es, ou qui transmet des r\xE9ponses \xE0 un test ou \xE0 un examen, ou dont la validation a des cons\xE9quences financi\xE8res ou juridiques, les donn\xE9es saisies peuvent-elles \xEAtre modifi\xE9es, mises \xE0 jour ou r\xE9cup\xE9r\xE9es par l'utilisateur ?",intituleCourt:"R\xE9versibilit\xE9 des formulaires \xE0 cons\xE9quences",niveauWcag:"AA",wcag:["3.3.4"],wcagVerifie:!0,methode:"manuel",commentTester:"Pour un formulaire \xE0 cons\xE9quences juridiques/financi\xE8res, de test/examen, ou de suppression de donn\xE9es : r\xE9versibilit\xE9, v\xE9rification, ou confirmation explicite avant validation.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"11.13",thematique:"Formulaires",intitule:"La finalit\xE9 d'un champ de saisie peut-elle \xEAtre d\xE9duite pour faciliter le remplissage automatique des champs avec les donn\xE9es de l'utilisateur ?",intituleCourt:"Finalit\xE9 du champ (autocomplete)",niveauWcag:"AA",wcag:["1.3.5"],wcagVerifie:!0,methode:"mixte",commentTester:"Les champs collectant des donn\xE9es personnelles (nom, e-mail, adresse) doivent porter l'attribut autocomplete avec une valeur standard (name, email, street-address). La pr\xE9sence se d\xE9tecte, la pertinence de la valeur se v\xE9rifie.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur"]},{id:"12.1",thematique:"Navigation",intitule:"Chaque ensemble de pages dispose-t-il de deux syst\xE8mes de navigation diff\xE9rents, au moins (hors cas particuliers) ?",intituleCourt:"Deux syst\xE8mes de navigation au moins",niveauWcag:"AA",wcag:["2.4.5"],wcagVerifie:!0,methode:"manuel",commentTester:"Un ensemble de pages doit offrir au moins deux moyens parmi : menu principal, moteur de recherche, plan du site. V\xE9rifier leur pr\xE9sence effective sur l'ensemble concern\xE9.",casParticuliers:["Les pages proposant uniquement une seule page (ensemble r\xE9duit \xE0 une page) sont non concern\xE9es."],casParticuliersVerifie:!1,outils:["manuel"]},{id:"12.2",thematique:"Navigation",intitule:"Dans chaque ensemble de pages, le menu et les barres de navigation sont-ils toujours \xE0 la m\xEAme place (hors cas particuliers) ?",intituleCourt:"Menu et barres de navigation \xE0 place constante",niveauWcag:"AA",wcag:["3.2.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Les m\xEAmes syst\xE8mes de navigation doivent appara\xEEtre au m\xEAme endroit et dans le m\xEAme ordre relatif d'une page \xE0 l'autre. Comparer plusieurs pages de l'ensemble.",casParticuliers:[],casParticuliersVerifie:!1,outils:["manuel"]},{id:"12.3",thematique:"Navigation",intitule:"La page \xAB plan du site \xBB est-elle pertinente ?",intituleCourt:"Pertinence du plan du site",niveauWcag:"AA",wcag:["2.4.5"],wcagVerifie:!0,methode:"manuel",commentTester:"Le plan du site doit refl\xE9ter l'organisation r\xE9elle du site et donner acc\xE8s aux rubriques principales. Non applicable en l'absence de plan du site.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"12.4",thematique:"Navigation",intitule:"Dans chaque ensemble de pages, la page \xAB plan du site \xBB est-elle atteignable de mani\xE8re identique ?",intituleCourt:"Plan du site atteignable de fa\xE7on identique",niveauWcag:"AA",wcag:["2.4.5","3.2.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Le lien vers le plan du site doit se trouver au m\xEAme emplacement et sous le m\xEAme intitul\xE9 sur toutes les pages de l'ensemble. Non applicable sans plan du site.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"12.5",thematique:"Navigation",intitule:"Dans chaque ensemble de pages, le moteur de recherche est-il atteignable de mani\xE8re identique ?",intituleCourt:"Moteur de recherche atteignable de fa\xE7on identique",niveauWcag:"AA",wcag:["2.4.5","3.2.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Le moteur de recherche interne doit figurer au m\xEAme endroit sur toutes les pages de l'ensemble. Non applicable en l'absence de moteur de recherche.",casParticuliers:[],casParticuliersVerifie:!0,outils:["manuel"]},{id:"12.6",thematique:"Navigation",intitule:"Les zones de regroupement de contenus pr\xE9sentes dans plusieurs pages web (zones d\u2019en-t\xEAte, de navigation principale, de contenu principal, de pied de page et de moteur de recherche) peuvent-elles \xEAtre atteintes ou \xE9vit\xE9es ?",intituleCourt:"Zones de regroupement atteignables ou \xE9vitables",niveauWcag:"A",wcag:["1.3.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Les r\xE9gions (banner, navigation, main, contentinfo, search) doivent \xEAtre balis\xE9es par les \xE9l\xE9ments HTML5 ou les r\xF4les ARIA correspondants, permettant \xE0 un lecteur d'\xE9cran de les atteindre ou de les sauter. La pr\xE9sence des landmarks se d\xE9tecte automatiquement.",casParticuliers:[],casParticuliersVerifie:!0,outils:["axe","inspecteur","NVDA"]},{id:"12.7",thematique:"Navigation",intitule:"Dans chaque page web, un lien d\u2019\xE9vitement ou un lien d\u2019acc\xE8s rapide \xE0 la zone de contenu principal est-il pr\xE9sent (hors cas particuliers) ?",intituleCourt:"Lien d\u2019\xE9vitement vers le contenu principal",niveauWcag:"A",wcag:["2.4.1"],wcagVerifie:!0,methode:"mixte",commentTester:"Un lien \xAB Aller au contenu \xBB doit \xEAtre le premier \xE9l\xE9ment focusable, pointer vers la zone de contenu principal et \xEAtre fonctionnel (le focus se d\xE9place r\xE9ellement). Visible au moins \xE0 la prise de focus. La pr\xE9sence du lien se d\xE9tecte, sa fonctionnalit\xE9 se teste au clavier.",casParticuliers:[],casParticuliersVerifie:!1,outils:["clavier","inspecteur"]},{id:"12.8",thematique:"Navigation",intitule:"Dans chaque page web, l\u2019ordre de tabulation est-il coh\xE9rent ?",intituleCourt:"Ordre de tabulation coh\xE9rent",niveauWcag:"A",wcag:["2.4.3"],wcagVerifie:!0,methode:"manuel",commentTester:"Tabuler dans toute la page : le focus doit suivre l'ordre visuel et logique (g\xE9n\xE9ralement gauche\u2192droite, haut\u2192bas). Pas de tabindex positif, pas de saut incoh\xE9rent. \xC0 rev\xE9rifier apr\xE8s ouverture des composants dynamiques (modale, menu).",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"12.9",thematique:"Navigation",intitule:"Dans chaque page web, la navigation ne doit pas contenir de pi\xE8ge au clavier. Cette r\xE8gle est-elle respect\xE9e ?",intituleCourt:"Absence de pi\xE8ge au clavier",niveauWcag:"A",wcag:["2.1.2"],wcagVerifie:!0,methode:"manuel",commentTester:"On doit pouvoir entrer ET sortir de chaque composant au clavier seul, sans rester bloqu\xE9. Tester particuli\xE8rement les modales, lecteurs vid\xE9o, widgets tiers et champs riches.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"12.10",thematique:"Navigation",intitule:"Dans chaque page web, les raccourcis clavier n\u2019utilisant qu\u2019une seule touche (lettre minuscule ou majuscule, ponctuation, chiffre ou symbole) sont-ils contr\xF4lables par l\u2019utilisateur ?",intituleCourt:"Raccourcis clavier \xE0 une touche contr\xF4lables",niveauWcag:"A",wcag:["2.1.4"],wcagVerifie:!0,methode:"manuel",commentTester:"Si un raccourci \xE0 touche unique existe, il doit pouvoir \xEAtre d\xE9sactiv\xE9, remapp\xE9, ou n'\xEAtre actif qu'au focus du composant concern\xE9. Non applicable si aucun raccourci mono-touche n'est impl\xE9ment\xE9.",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"12.11",thematique:"Navigation",intitule:"Dans chaque page web, les contenus additionnels apparaissant au survol, \xE0 la prise de focus ou \xE0 l\u2019activation d\u2019un composant d\u2019interface sont-ils, si n\xE9cessaire, atteignables au clavier ?",intituleCourt:"Contenus additionnels atteignables au clavier",niveauWcag:"AA",wcag:["2.1.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Menus d\xE9roulants, infobulles et sous-menus d\xE9clench\xE9s au survol doivent aussi \xEAtre accessibles et parcourables au clavier. \xC0 distinguer de 10.13 (contr\xF4le du contenu additionnel) et 10.14 (rendu au focus).",casParticuliers:[],casParticuliersVerifie:!0,outils:["clavier","manuel"]},{id:"13.1",thematique:"Consultation",intitule:"Pour chaque page web, l\u2019utilisateur a-t-il le contr\xF4le de chaque limite de temps modifiant le contenu (hors cas particuliers) ?",intituleCourt:"Contr\xF4le des limites de temps",niveauWcag:"A",wcag:["2.2.1"],wcagVerifie:!0,methode:"manuel",commentTester:"Rafra\xEEchissement automatique, redirection diff\xE9r\xE9e, session expirant : l'utilisateur doit pouvoir d\xE9sactiver, ajuster ou prolonger }
