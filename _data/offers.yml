      short: "Fiche produit, panier et commande passés en revue. Un plan d'action priorisé."
      price: "1&nbsp;200&nbsp;€"
      for: Les boutiques qui veulent savoir quoi améliorer en priorité.
      includes: ["Analyse de la fiche produit, du panier et du tunnel de commande", Rapport priorisé avec plan d'action, Bases d'accessibilité incluses]
      excludes: [La mise en œuvre des corrections (possible ensuite sur devis)]
    en:
      title: UX review of your shop + action plan
      short: Product page, cart and checkout reviewed. A prioritised action plan.
      price: "€1,200"
      for: Shops that want to know what to improve first.
      includes: ["Review of the product page, cart and checkout", Prioritised report with an action plan, Accessibility basics included]
      excludes: ["Making the changes (possible afterwards, quoted separately)"]

