# Home page copy for the new client-facing blocks (FR is the source text).
# Existing blocks (H1 carousel, About, case studies) stay in English, untouched.

fr:
  # Longest H1 line in em (static + widest word + gap): the desktop font
  # shrinks only when that line would not fit.
  h1_fit: 14.2
  # H1 carousel: data-key stays the same in both languages (home-interaction.js
  # matches on keys), only the visible text changes. "|" splits a word into
  # groups that never break inside (article + noun stay together on mobile).
  h1:
    - id: carousel-transformo
      static: Je conçois
      words:
        - {key: interfaces, label: des interfaces}
        - {key: visuals, label: des visuels}
        - {key: experiences, label: des expériences}
        - {key: identities, label: des identités}
    - id: carousel-en
      static: pour
      words:
        - {key: enhance usability, label: "faciliter|l'usage"}
        - {key: simplify journeys, label: simplifier|les parcours}
        - {key: elevate brands, label: valoriser|les marques}
        - {key: build trust, label: inspirer|confiance}
    - id: carousel-para
      static: guidé par
      words:
        - {key: curiosity, label: la curiosité}
        - {key: creativity, label: la créativité}
        - {key: storytelling, label: le récit}
        - {key: empathy, label: "l'empathie"}
  tagline: Designer produit et visuel
  hero_label: Présentation
  value: "Votre boutique en ligne, belle, à jour et qui vend. Designer web &amp; e&#8209;commerce à Strasbourg, sur PrestaShop et WordPress. En français, in English, en español."
  offers_btn: Voir les offres
  offers_url: /services/
  cv_btn: "Recruteurs&nbsp;: CV et parcours"
  cv_url: /cv/
  availability: 1 projet à la fois.
  status_label: État
  status_city: Strasbourg
  status_time: Heure locale à Strasbourg
  status_avail: 1 projet à la fois
  copy_btn: Copier
  copy_label: "Copier l'adresse email"
  copied: Adresse copiée.
  copy_fail: "Copie impossible. Sélectionnez l'adresse à la main."
  what_title: Ce que je fais pour vous
  what_all: Voir toutes les offres
  vat: "TVA non applicable, art. 293 B du CGI."
  testimonials_title: Ils m'ont fait confiance
  projects_title: Projets
  projects_all: Voir tous les projets
  case_label: "Voir l'étude de cas %s"
