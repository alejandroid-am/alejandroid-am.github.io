# Home page copy (FR is the source text). Everything here is editable.
# The process ("Comment ça se passe") now lives on /services/ (services_page.yml).

fr:
  # H1: three lines, the third one interchangeable (no final full stop). The first
  # variant is the one in the HTML (no JS, search engines) and the accessible name.
  # Hover (mouse), a click / tap on the line, or the hint button shows the next one.
  # fit: width in em of the widest line (line1 here = 9.06 em with Bricolage 800),
  # plus a small margin. The H1 size is the container width / fit, so line 1 never
  # breaks and the third line stays the third line. Re-measure if you change a text
  # (site.js shrinks the H1 anyway if a line would not fit).
  h1:
    line1: "Designer web et UX/UI,"
    line2: je conçois
    words: [des interfaces claires, des boutiques en ligne, des sites vitrines, des applications, des outils sur mesure, des visuels]
    fit: 9.25
    hint: Survolez ou cliquez la dernière ligne.
    next_label: Afficher une autre fin de phrase
  # Factual sentence (who, what, where, for whom), visible for visitors and search engines.
  value: "Alejandro Amaro Mendoza, à Strasbourg. Boutiques en ligne (PrestaShop, WordPress), sites vitrines, applications mobiles, outils sur mesure. En français, in English, en español."
  offers_btn: Voir les offres
  about_btn: Parcours et compétences
  # One scene: a sentence that lights up word by word while scrolling.
  # [[BORRADOR]] Draft written from the offers: rewrite it.
  scene_label: Le point de départ
  scene: "Une boutique peut être belle et perdre ses ventes entre la fiche produit, le panier et la commande."
  what_title: Ce que je fais pour vous
  what_all: Voir toutes les offres
  vat: "TVA non applicable, art. 293 B du CGI."
  projects_title: Projets
  projects_all: Voir tous les projets
  # How many projects the home rail shows (by home_order); the last card links to /projets/
  rail_limit: 4
  case_label: "Voir l'étude de cas %s"
  cover_alt: "Couverture du projet %s"
  contact_btn: Écrire via le formulaire
  contact_btn_mail: Me contacter      # used while form_enabled is false

