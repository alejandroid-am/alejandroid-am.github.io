# Home page copy (FR is the source text). Everything here is editable.
# The process ("Comment ça se passe") now lives on /services/ (services_page.yml).

fr:
  # H1: fixed start + one interchangeable last word + end. The first word is the
  # one in the HTML (no JS, search engines). Hover (mouse), click on the word or
  # the "autre combinaison" button shows the next one.
  h1:
    before: Je conçois des boutiques en ligne
    words: [claires, rassurantes, simples à utiliser]
    after: "."
    hint: Survolez ou cliquez le dernier mot.
    other: Autre combinaison
  value: "Designer web &amp; e&#8209;commerce à Strasbourg, sur PrestaShop et WordPress. En français, in English, en español."
  offers_btn: Voir les offres
  about_btn: Parcours et compétences
  # One scene: a sentence that lights up word by word while scrolling.
  # [[BORRADOR]] Draft written from the offers: rewrite it.
  scene_label: Le point de départ
  scene: "Une boutique peut être belle et perdre ses ventes entre la fiche produit, le panier et la commande."
  what_title: Ce que je fais pour vous
  what_all: Voir toutes les offres
  vat: "TVA non applicable, art. 293 B du CGI."
  projects_title: Projets
  projects_all: Voir tous les projets
  # How many projects the home rail shows (by home_order); the last card links to /projets/
  rail_limit: 4
  case_label: "Voir l'étude de cas %s"
  cover_alt: "Couverture du projet %s"
  contact_btn: Écrire via le formulaire
  contact_btn_mail: Me contacter      # used while form_enabled is false

