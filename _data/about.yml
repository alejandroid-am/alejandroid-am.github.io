# The story (Ale's current About text, unchanged). Same English text on both
# versions. [[BORRADOR]] Ale rewrites it by hand.
story:
  - "<strong>Am I the right person for your project?</strong><br>Let's find out."
  - "I don't have a standard background, and honestly? That's my biggest asset. My design process is shaped by a life of constant reinvention. I learned <strong>resilience</strong> in Cuba, <strong>business strategy</strong> in Chile where I co-founded <a href=\"https://somosarte.cl/\" target=\"_blank\" rel=\"noopener noreferrer\"><em>Somos Arte</em></a> and built a community of 10,000+ people from scratch, and <strong>adaptability</strong> in France, where I moved for love and mastered a third language."
  - "<strong>Why does this matter to you?</strong><br>Because I don't look at a project and just see colors and typography. Thanks to my entrepreneurial roots, I see business goals, constraints, and user needs."
  - "I also code prototypes, model in Blender and define brand identities."
