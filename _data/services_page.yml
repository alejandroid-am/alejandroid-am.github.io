      a: "Sous 48&nbsp;h ouvrées."
    - q: "Quel est le délai&nbsp;?"
      a: "Le délai dépend du projet. Il est fixé avec vous dans le devis, avant de commencer."
    - q: "Dans quelles langues travaillez-vous&nbsp;?"
      a: "En français, in English, en español."
en:
  title: Offers and prices
