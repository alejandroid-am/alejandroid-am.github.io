<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Title -->
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- SEO Meta -->
  <meta name="description" content="{{ page.description | default: site.description | strip_html | truncate: 160 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | truncate: 200 }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.cover_image | default: page.image | default: '/assets/img/og-default.webp' | absolute_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }}">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_html | truncate: 200 }}">
  <meta name="twitter:image" content="{{ page.cover_image | default: page.image | default: '/assets/img/og-default.webp' | absolute_url }}">

  <!-- Content Security Policy (Removed for local development compatibility) -->

  <!-- Fonts: Poppins (subset Latin, key weights, swap) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" href="/assets/img/favicon.ico">

  <!-- JSON-LD Person Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Alejandro Amaro Mendoza",
    "url": "https://alejandro-is.me",
    "jobTitle": "Product & Visual Designer",
    "sameAs": [
      "https://www.linkedin.com/in/alejandro-a-mendoza/"
    ],
    "knowsAbout": ["UX Design", "UI Design", "Visual Identity", "Web Development", "Product Design"],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Strasbourg",
      "addressCountry": "FR"
    }
  }
  </script>
</head>

<body class="{{ page.title | downcase | slugify }}-page">

  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Custom Cursor (progressive enhancement — hidden until JS loads) -->
  <div class="custom-cursor" aria-hidden="true"></div>

  <!-- Header -->
  <header role="banner">
    <div class="container header-content">
      <a href="/" class="logo" aria-label="Alejandro A.M. — Home">alejandro a.m.</a>
      
      <nav id="desktop-menu" class="desktop-nav" aria-label="Main navigation">
        <ul>
          <li><a href="/#about">about</a></li>
          <li><a href="/#projects">projects</a></li>
          <li><a href="/#contact">contact</a></li>
          <li><a href="/tools/">tools</a></li>
        </ul>
      </nav>

      <button id="menu-btn" class="menu-btn" aria-expanded="false" aria-controls="menu" aria-label="Toggle navigation menu">
        <svg id="icon-menu" class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
        <svg id="icon-close" class="icon hidden-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>

      <nav id="menu" class="nav-menu" aria-label="Mobile navigation">
        <ul>
          <li><a href="/#about">about</a></li>
          <li><a href="/#projects">projects</a></li>
          <li><a href="/#contact">contact</a></li>
          <li><a href="/tools/">tools</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer role="contentinfo">
    <div class="container footer-container">
    </div>
    <div class="footer-bottom">
      <p id="copyright">© 2026 Alejandro Amaro Mendoza — Design & Code</p>
      <span class="legal-link" aria-hidden="true">·</span>
      <a href="/tools/" class="legal-link">Tools</a>
      <span class="legal-link" aria-hidden="true">·</span>
      <a href="/mentions-legales.html" class="legal-link">Mentions légales</a>
    </div>
  </footer>

  <!-- Back to Top -->
  <a href="#" id="back-to-top" class="back-to-top-btn" title="Back to top" aria-label="Back to top">&gt;</a>

  <!-- Scripts -->
  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/zoom.js"></script>
  <script src="/assets/js/cursor.js"></script>
</body>
</html>
